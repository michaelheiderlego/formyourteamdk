<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found · Form Your Team</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/assets/fonts.css">
<style>
:root { --bg: #F3F4F7; --ink: #181B32; --ink-2: #454A65; --btn: #181B32; --btn-ink: #FFFFFF; color-scheme: light; }
@media (prefers-color-scheme: dark) { :root { --bg: #10121B; --ink: #ECEEF6; --ink-2: #B6BACC; --btn: #ECEEF6; --btn-ink: #12141F; color-scheme: dark; } }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--ink); font-family: "Figtree", system-ui, sans-serif; padding: 24px; box-sizing: border-box; }
main { max-width: 520px; display: grid; gap: 18px; }
.dots { display: grid; grid-template-columns: repeat(3, 16px); gap: 6px; }
.dots i { width: 16px; height: 16px; border-radius: 5px; }
h1 { font-family: "Schibsted Grotesk", system-ui, sans-serif; font-size: clamp(40px, 9vw, 72px); line-height: .95; letter-spacing: -.03em; margin: 0; }
p { color: var(--ink-2); font-size: 18px; line-height: 1.5; margin: 0; }
a.btn { justify-self: start; display: inline-flex; align-items: center; gap: 8px; padding: 12px 22px; border-radius: 999px; background: var(--btn); color: var(--btn-ink); font-weight: 600; text-decoration: none; transition: transform 160ms cubic-bezier(.23,1,.32,1); }
a.btn:active { transform: scale(.97); }
</style>
</head>
<body>
<main>
  <span class="dots" aria-hidden="true"><i style="background:#DE942A"></i><i style="background:#E0634D"></i><i style="background:#3A86CF"></i><i style="background:#7D5ACF"></i><i style="background:#279A76"></i><i style="background:#6C9724"></i></span>
  <h1>This page isn’t part of the team.</h1>
  <p>The link may be old or mistyped. Everything lives on the front page: the six conversations, your canvas and how to get in touch.</p>
  <a class="btn" href="/">Go to Form Your Team →</a>
</main>
</body>
</html>
