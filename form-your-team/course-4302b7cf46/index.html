<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Facilitation Course · Form Your Team</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Schibsted+Grotesk:wght@600;700;800&display=swap">
<style>
:root{
  --ink:#191B2E;--ink2:#474B63;--ink3:#6A6E84;--paper:#FBF8F2;--surface:#FFFFFF;--line:#E7E2D8;--line2:#D9D3C6;
  --c1:#DE942A;--c2:#E0634D;--c3:#3A86CF;--c4:#7D5ACF;--c5:#279A76;--c6:#6C9724;
  --s1:#FBEFD9;--s2:#FCE6E1;--s3:#E1EEFA;--s4:#EEE7FB;--s5:#DDF2EA;--s6:#EAF2DB;
  --d1:#8A5310;--d2:#A23A27;--d3:#1F5C99;--d4:#513296;--d5:#16674E;--d6:#466417;
  --display:"Schibsted Grotesk",system-ui,sans-serif;--body:Figtree,system-ui,sans-serif;
  --side:300px;--r:18px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.6 var(--body);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
a{color:inherit}
img{max-width:100%;display:block}
:focus-visible{outline:3px solid var(--c3);outline-offset:2px;border-radius:6px}
.mark{display:inline-grid;grid-template-columns:repeat(3,8px);gap:3px}
.mark i{width:8px;height:8px;border-radius:2.4px;display:block}

/* layout */
.app{display:grid;grid-template-columns:var(--side) 1fr;min-height:100vh}
.side{position:sticky;top:0;height:100vh;overflow:auto;background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column}
.side-head{padding:22px 22px 16px;border-bottom:1px solid var(--line);display:grid;gap:14px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;font:700 15px/1.2 var(--display);letter-spacing:-.01em;background:none;border:0;padding:0;text-align:left}
.brand small{display:block;font:500 12.5px/1.3 var(--body);color:var(--ink3);letter-spacing:0}
.prog{display:grid;gap:6px;font-size:13px;color:var(--ink2)}
.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--c5);border-radius:3px;transition:width .4s ease}
.mods{padding:10px 10px 30px;margin:0;list-style:none}
.mod{margin-top:6px}
.mod-btn{display:flex;align-items:center;gap:10px;width:100%;padding:10px 12px;border:0;background:none;border-radius:12px;text-align:left;font:650 14px/1.3 var(--display);letter-spacing:-.005em}
.mod-btn:hover{background:var(--paper)}
.mod-n{flex:none;width:26px;height:26px;border-radius:8px;display:grid;place-items:center;font:700 12.5px var(--display);color:#fff;background:var(--ink)}
.mod-btn .chev{margin-left:auto;transition:transform .2s;color:var(--ink3)}
.mod.open .chev{transform:rotate(90deg)}
.lessons{list-style:none;margin:2px 0 8px;padding:0 0 0 22px;display:none}
.mod.open .lessons{display:block}
.les{display:flex;gap:10px;align-items:flex-start;width:100%;padding:8px 10px;border:0;background:none;border-radius:10px;text-align:left;font-size:14px;line-height:1.35;color:var(--ink2)}
.les:hover{background:var(--paper);color:var(--ink)}
.les[aria-current="page"]{background:var(--paper);color:var(--ink);font-weight:650}
.chk{flex:none;width:18px;height:18px;border-radius:50%;border:2px solid var(--line2);margin-top:1px;display:grid;place-items:center}
.les.done .chk{background:var(--c5);border-color:var(--c5)}
.les.done .chk::after{content:"";width:8px;height:4px;border:2px solid #fff;border-top:0;border-right:0;transform:translateY(-1px) rotate(-45deg)}
.les .min{margin-left:auto;font-size:12px;color:var(--ink3);font-weight:500;padding-left:6px;white-space:nowrap}

.main{min-width:0}
.topbar{display:none}
.wrap{max-width:880px;margin:0 auto;padding:40px 40px 80px}

/* home */
.hero{display:grid;grid-template-columns:1.2fr .8fr;gap:30px;align-items:center;background:var(--ink);color:var(--paper);border-radius:28px;padding:44px 44px 40px;position:relative;overflow:hidden}
.eyebrow{font:600 13px/1 var(--body);letter-spacing:0;color:var(--ink3)}
.hero .eyebrow{color:#B6BACC}
h1,h2,h3{font-family:var(--display);font-weight:600;letter-spacing:-.025em;line-height:1.08;margin:0}
.hero h1{font-size:clamp(32px,4.4vw,48px);margin:12px 0 14px}
.hero p{margin:0;color:#D5D8E4;font-size:17px}
.hero-actions{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-top:24px}
.hero-art{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.hero-art span{aspect-ratio:1;border-radius:18px;display:grid;place-items:center;padding:8px}
.hero-art img{width:100%;height:100%;object-fit:contain;mix-blend-mode:multiply}
.btn{display:inline-flex;align-items:center;gap:8px;border-radius:999px;padding:12px 20px;font:650 15px/1 var(--body);border:2px solid transparent;text-decoration:none;white-space:nowrap}
.btn-primary{background:var(--paper);color:var(--ink)}
.btn-primary:hover{background:#fff}
.btn-dark{background:var(--ink);color:var(--paper)}
.btn-dark:hover{background:#2B2E46}
.btn-ghost{background:var(--surface);border-color:var(--line2);color:var(--ink)}
.btn-ghost:hover{border-color:var(--ink3)}
.btn-done{background:var(--s5);color:var(--d5);border-color:var(--s5)}
.hero .note{font-size:14px;color:#B6BACC}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:22px 0 40px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px}
.stat b{display:block;font:700 26px/1.1 var(--display);letter-spacing:-.02em}
.stat span{font-size:14px;color:var(--ink2)}
.sec-title{font-size:26px;margin:0 0 6px}
.sec-intro{color:var(--ink2);margin:0 0 20px}
.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.card{display:flex;flex-direction:column;gap:10px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:20px;transition:border-color .2s,transform .2s}
.card:hover{border-color:var(--line2)}
.card-top{display:flex;align-items:center;gap:12px}
.card-top .ill{width:60px;height:60px;border-radius:14px;display:grid;place-items:center;flex:none;padding:4px}
.card-top .ill img{width:100%;height:100%;object-fit:contain;mix-blend-mode:multiply}
.card h3{font-size:19px}
.card p{margin:0;color:var(--ink2);font-size:14.5px;line-height:1.5}
.card-meta{margin-top:auto;display:flex;align-items:center;gap:10px;font-size:13px;color:var(--ink3)}
.card-meta .bar{flex:1}

/* lesson */
.crumb{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--ink3);margin-bottom:12px;flex-wrap:wrap}
.crumb button{background:none;border:0;padding:0;color:var(--ink2);text-decoration:underline;text-underline-offset:3px}
.l-title{font-size:clamp(28px,3.6vw,40px);margin:0 0 8px}
.l-meta{display:flex;gap:14px;align-items:center;color:var(--ink3);font-size:14px;margin-bottom:22px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font-weight:650;font-size:12.5px;letter-spacing:.02em}
.player{position:relative;aspect-ratio:16/9;border-radius:24px;overflow:hidden;background:var(--ink);display:grid;place-items:center}
.player video{width:100%;height:100%;display:block;background:#000}
.ph{position:absolute;inset:0;display:grid;grid-template-columns:1fr 1fr;align-items:center;gap:20px;padding:6%}
.ph-txt{color:var(--paper);display:grid;gap:10px}
.ph-txt b{font:700 clamp(20px,2.8vw,32px)/1.1 var(--display);letter-spacing:-.02em}
.ph-txt span{color:#B6BACC;font-size:14.5px}
.ph-ill{height:100%;border-radius:20px;display:grid;place-items:center;padding:6%}
.ph-ill img{max-height:100%;object-fit:contain;mix-blend-mode:multiply}
.ph-ill.mark-only .mark{grid-template-columns:repeat(3,32px);gap:10px}
.ph-ill.mark-only .mark i{width:32px;height:32px;border-radius:9px}
.soon{display:inline-flex;align-self:start;justify-self:start;align-items:center;gap:8px;background:rgba(255,255,255,.1);border-radius:999px;padding:6px 12px;font-size:13px;color:#D5D8E4}
.soon i{width:8px;height:8px;border-radius:50%;background:var(--c1)}
.audio{margin-top:14px;width:100%}
.l-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:22px}
.box{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px 22px}
.box h2{font-size:17px;margin-bottom:10px;letter-spacing:-.01em}
.box ul{margin:0;padding:0;list-style:none;display:grid;gap:10px}
.box li{display:flex;gap:10px;line-height:1.45}
.box li::before{content:"";flex:none;width:8px;height:8px;border-radius:2.5px;margin-top:8px;background:var(--accent,var(--ink))}
.try{background:var(--accent-soft,var(--s1));border-color:transparent}
.try p{margin:0;font-size:16.5px;line-height:1.5;font-weight:500}
.dl{display:flex;flex-wrap:wrap;gap:10px}
.dl a{display:inline-flex;align-items:center;gap:8px;padding:9px 14px;border:1.5px solid var(--line2);border-radius:999px;text-decoration:none;font-weight:600;font-size:14px;background:var(--surface)}
.dl a:hover{border-color:var(--ink3)}
details.notes{margin-top:14px}
details.notes summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:10px;font:650 17px var(--display)}
details.notes summary::-webkit-details-marker{display:none}
details.notes summary .chev{transition:transform .2s;color:var(--ink3)}
details.notes[open] summary .chev{transform:rotate(90deg)}
details.notes .tx{margin-top:14px;display:grid;gap:12px;color:var(--ink2);max-width:68ch}
details.notes .tx p{margin:0}
.ask{display:flex;gap:14px;align-items:center;margin-top:14px;padding:16px 18px;border-radius:16px;border:1px dashed var(--line);text-decoration:none;color:var(--ink2);font-size:14.5px;line-height:1.45;transition:border-color .2s}
.ask:hover{border-color:var(--accent,#3A86CF)}
.ask b{color:var(--ink)}
.ask-ic{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--accent-soft,#E1EEFA);color:var(--accent-dark,#1F5C99);font:700 15px var(--display,sans-serif)}
.l-nav{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:28px;padding-top:22px;border-top:1px solid var(--line);flex-wrap:wrap}
.l-nav .right{display:flex;gap:10px;flex-wrap:wrap;margin-left:auto}
.plan{margin-top:14px}
.plan-bar{display:flex;gap:3px;height:12px;margin:6px 0 10px;border-radius:6px;overflow:hidden}
.plan-bar i{display:block;opacity:.85}
.glance{margin-top:22px}
.glance h2{font-size:17px;margin:0 0 10px;letter-spacing:-.01em}
.glance-row{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;max-width:620px}
.glance-card{margin:0;border-radius:16px;aspect-ratio:600/640;padding:6px;display:grid;place-items:center}
.glance-card svg{width:100%;height:100%}
.glance-card{cursor:zoom-in;transition:transform .2s,box-shadow .2s}
.glance-card:hover,.glance-card:focus-visible{box-shadow:0 10px 24px -14px rgba(25,27,46,.45);outline:none}
.lb{position:fixed;inset:0;z-index:100;background:rgba(25,27,46,.82);display:none;align-items:center;justify-content:center;padding:24px;cursor:zoom-out}
.lb.on{display:flex}
.lb figure{margin:0;border-radius:24px;height:min(88vh,calc((100vw - 140px)*640/600));aspect-ratio:600/640;padding:2%;box-sizing:border-box;display:grid;place-items:center;cursor:default;box-shadow:0 30px 80px -30px rgba(0,0,0,.6)}
.lb figure svg{width:100%;height:100%}
.lb button{position:absolute;width:48px;height:48px;border-radius:50%;border:0;background:rgba(255,255,255,.14);color:#fff;font-size:24px;line-height:1;cursor:pointer;display:grid;place-items:center}
.lb button:hover{background:rgba(255,255,255,.26)}
.lb .x{top:18px;right:18px}.lb .pv{left:18px;top:50%;transform:translateY(-50%)}.lb .nx{right:18px;top:50%;transform:translateY(-50%)}
.lb .ct{position:absolute;bottom:18px;left:50%;transform:translateX(-50%);color:#C9CCDA;font-size:14px}
@media (max-width:640px){.lb .pv,.lb .nx{top:auto;bottom:10px;transform:none}.lb figure{height:auto;width:100%}}
.plan-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:6px}
.plan-head span{font-size:14px;color:var(--ink3)}
.plan ol{list-style:none;margin:0;padding:0}
.plan li{display:grid;grid-template-columns:62px 1fr;gap:14px;padding:12px 0;border-top:1px solid var(--line)}
.plan li:first-child{border-top:0}
.plan li::before{display:none}
.plan .t{font:700 14px/1.4 var(--display);color:var(--accent-dark,var(--ink));font-variant-numeric:tabular-nums}
.plan .t small{display:block;font:500 12.5px var(--body);color:var(--ink3)}
.plan .w{font-weight:600;line-height:1.4}
.plan .q{display:block;margin-top:4px;font-weight:400;color:var(--ink2);font-style:italic}
#view:focus{outline:none}
.mats{display:grid;grid-template-columns:repeat(auto-fit,minmax(148px,1fr));gap:12px;margin-bottom:8px}
.mat{display:grid;gap:6px;align-content:start;padding:18px;border-radius:18px;background:var(--surface);border:1px solid var(--line);text-decoration:none;transition:border-color .2s,transform .2s}
.mat:hover{border-color:var(--mc)}
.mat-ic{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:var(--mc);color:#fff}
.mat b{font:700 17px var(--display);letter-spacing:-.01em}
.mat span:last-child{font-size:14px;color:var(--ink2);line-height:1.45}
@media (max-width:900px){.mats{grid-template-columns:1fr}}
.ai-note{margin:8px 2px 0;font-size:12.5px;color:var(--ink3)}
.foot{margin-top:50px;font-size:13px;color:var(--ink3)}

/* module intro on lesson page */
.mod-band{display:flex;gap:16px;align-items:center;background:var(--accent-soft,var(--paper));border-radius:20px;padding:14px 18px;margin-bottom:24px}
.mod-band img{width:64px;height:64px;object-fit:contain;mix-blend-mode:multiply;flex:none}
.mod-band p{margin:0;font-size:14.5px;color:var(--ink2)}
.mod-band strong{display:block;font:700 15px var(--display);color:var(--ink)}

/* mobile */
@media (max-width:900px){
  .app{grid-template-columns:1fr}
  .side{position:fixed;inset:0 auto 0 0;width:min(340px,88vw);z-index:30;transform:translateX(-102%);transition:transform .25s ease;box-shadow:0 0 0 100vmax rgba(25,27,46,0)}
  .side.open{transform:none;box-shadow:0 0 0 100vmax rgba(25,27,46,.35)}
  .topbar{display:flex;position:sticky;top:0;z-index:20;align-items:center;gap:10px;padding:10px 16px;background:rgba(251,248,242,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
  .topbar .t{font:700 14px var(--display);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .icon-btn{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--line2);background:var(--surface);border-radius:999px;padding:7px 12px;font-weight:600;font-size:14px}
  .wrap{padding:22px 16px 60px}
  .hero{grid-template-columns:1fr;padding:28px 22px}
  .hero-art{display:none}
  .stats{grid-template-columns:1fr 1fr 1fr;gap:8px}
  .stat{padding:12px}
  .stat b{font-size:20px}
  .stat span{font-size:12.5px}
  .cards,.l-grid{grid-template-columns:1fr}
  .ph{grid-template-columns:1fr;padding:22px}
  .ph-ill{display:none}
  .player{border-radius:18px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

.plan>summary{list-style:none;cursor:pointer}
.plan>summary::-webkit-details-marker{display:none}
.plan>summary span{display:inline-flex;align-items:center;gap:6px}
.plan>summary .chev{transition:transform .2s}
.plan[open]>summary .chev{transform:rotate(90deg)}
.plan:not([open]) .plan-bar,.plan:not([open]) ol{display:none}
.mats-line{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 10px;margin:18px 0 0;font-size:14.5px;color:var(--ink3)}
.mats-line b{color:var(--ink);font-weight:600;margin-right:6px}
.mats-line a{color:var(--ink2);text-underline-offset:3px}
.mats-line a:hover{color:var(--ink)}
</style>
<script defer src="https://cloud.umami.is/script.js" data-website-id="4eb5e541-a1b3-42ee-b086-a4857eaf6302"></script>
<script>
// Umami events: buy clicks, downloads, Miro, and video plays
(function(){
  function t(n,d){try{window.umami&&window.umami.track(n,d)}catch(e){}}
  document.addEventListener('click',function(e){
    var a=e.target.closest&&e.target.closest('a[href]');if(!a)return;var h=a.getAttribute('href')||'';
    if(/lemonsqueezy\.com/.test(h))t('buy-course-click',{place:location.pathname+location.search});
    else if(/\.pdf($|\?)/i.test(h)||/\.txt($|\?)/i.test(h))t('download',{file:h.split('/').pop()});
    else if(/miro\.com/.test(h))t('miro-template-click');
    else if(/^mailto:/.test(h))t('email-click');
  },true);
  document.addEventListener('play',function(e){var v=e.target;if(!v||v.tagName!=='VIDEO'||v.__umami)return;v.__umami=1;t('video-play',{video:(v.currentSrc||v.src||'').split('/').pop(),page:location.pathname+location.search});},true);
})();
</script>
</head>
<body>
<div class="app">
  <nav class="side" id="side" aria-label="Course lessons"></nav>
  <div class="main">
    <div class="topbar">
      <button class="icon-btn" id="menu" aria-controls="side" aria-expanded="false"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>Lessons</button>
      <span class="t" id="topt"></span>
    </div>
    <main class="wrap" id="view" tabindex="-1"></main>
  </div>

Here’s how it works. First, a short module on facilitating your own team, because leading and facilitating at the same time is its own skill. Then one module for each of the six conversations: why it matters, how to run the exercise step by step, and what to do when things get tricky. We finish with how to plan your series and keep it alive afterwards.","Every lesson is short. Each one ends with a few takeaways and one small thing to try. Download the canvases and the workbook, and keep them next to you as we go.","By the end, you’ll be able to run all six conversations with confidence, handle the awkward moments, and turn what your team says into agreements that actually change how you work together. Let’s begin."],"takeaways":["This course teaches you to run the six conversations with your own team.","No facilitation experience is needed: just a team and some time.","Each lesson is short and ends with one thing to try."],"try":"Write down one thing about how your team works together that you’d like to be different in three months. Keep it; we’ll come back to it.","downloads":["guide","canvases","workbook"],"visuals":[[2,"foundation"],[5,"six"],[10,"course-map"],[13,"lesson-parts"],[16,"six"]],"video":"videos/00-01.mp4","captions":"data:text/vtt;base64,V0VCVlRUCgowMDowMDowMy4wODAgLS0+IDAwOjAwOjA3LjgxMApIaSwgSeKAmW0gTWljaGFlbC4gV2VsY29tZSB0byB0aGUgRm9ybSBZb3VyIFRlYW0gZmFjaWxpdGF0aW9uIGNvdXJzZS4KCjAwOjAwOjA3Ljg2MCAtLT4gMDA6MDA6MTIuNTkwCkZvciBtb3JlIHRoYW4gZm91cnRlZW4geWVhcnMgSeKAmXZlIHdvcmtlZCB3aXRoIHRlYW1zIGFuZCBsZWFkZXJzIG9uIGhvdyB0aGV5IHdvcmsgdG9nZXRoZXIuCgowMDowMDoxMi42NDAgLS0+IDAwOjAwOjE3LjExMApBbmQgb25lIHRoaW5nIGtlZXBzIGNvbWluZyBiYWNrOiBncmVhdCB0ZWFtcyBkb27igJl0IGhhcHBlbiBieSBhY2NpZGVudC4KCjAwOjAwOjE3LjE2MCAtLT4gMDA6MDA6MTkuNDcwClRoZXkgc3RhbmQgb24gYSBzdHJvbmcgZm91bmRhdGlvbi4KCjAwOjAwOjE5LjUyMCAtLT4gMDA6MDA6MjMuMTcwCkFuZCB0aGF0IGZvdW5kYXRpb24gaXMgYnVpbHQgaW4gYSBmZXcgaG9uZXN0IGNvbnZlcnNhdGlvbnMuCgowMDowMDoyMy4yMjAgLS0+IDAwOjAwOjMyLjA1MApZb3UgcHJvYmFibHkgYWxyZWFkeS art where it hurts or where the energy is; there is no fixed order.","Every conversation ends with something written on the canvas."],"try":"Take the team health check yourself, then ask two team members to take it too. Compare where you each would start.","downloads":["guide","canvas-overview","workbook"],"visuals":[[1,"six"],[5,"six-pairs"],[9,"health"],[14,"pattern"],[18,"canvas"],[22,"health"]],"video":"videos/00-02.mp4","captions":"data:text/vtt;base64,V0VCVlRUCgowMDowMDowMy4xMDAgLS0+IDAwOjAwOjA2LjI3MApCZWZvcmUgd2UgZGl2ZSBpbiwgbGV04oCZcyBsb29rIGF0IHRoZSB3aG9sZSBwaWN0dXJlLgoKMDA6MDA6MDYuMzIwIC0tPiAwMDowMDoxMi4xNzAKVGhlIHNpeCBjb252ZXJzYXRpb25zIGFyZTogV2h5IGFyZSB3ZSBoZXJlPyBXaG8gYXJlIHdlPyBIb3cgZG8gd2Ugd29yaz8KCjAwOjAwOjEyLjIyMCAtLT4gMDA6MDA6MTMuOTkwCkhvdyBkbyB3ZSBtYWtlIGRlY2lzaW9ucz8KCjAwOjAwOjE0LjA0MCAtLT4gMDA6MDA6MTUuODMwCkhvdyBkbyB3ZSB3YW50IHRvIGJlIHRvZ2V0aGVyPwoKMDA6MDA6MTUuODgwIC0tPiAwMDowMDoxOC4xMzAKQW5kIGhvdyBkbyB3ZSBsZWFybiBhbmQgcmVmb3JtPwoKMDA6MDA6MTguMTgwIC0tPiAwMDowMDoyMC42NTAKWW91IGNhbiB0aGluayBvZiB0aGVtIGluIHRocmVlIHBhaXJzLgoKMDA6MDA6MjAuNzAwIC0tPiAwMDowMDoyNy41MTAKV2h5IGFuZCBXaG8gYXJlIGFib3V0IGlkZW50aXR5OiB0aGUgcHVycG9zZSB0aGF0IGhvbGRzIHlvdSB0b2dldGhlciwgYW5kIHRoZSBwZW9wbGUgd2hvIG1ha2UgdXAgdGhlIHRlYW0uCgowMDowMDoyNy41NjAgLS0+IDAwOjAwOjMzLjQ1MApSaHl0aG0gYW5kIERlY2lzaW9ucyBhcmUgYWJvdXQgb3BlcmF0aW5nOiBob3cgd29yayBmbG93cywgYW5kIGhvdyBjaG9pY2VzIGdldCBtYWRlLgoKMDA6MDA6MzMuNTAwIC0tPiAwMDowMDozOS44NzAKVmFsdWVzIGFuZCBFdm9sdmUgYXJlIGFib3V0IGN1bHR1cmUgYW5kIHRpbWU6IGhvdyB5b3UgdHJlYXQgZWFjaCBvdGhlciwgYW5kIGhvdyB5b3Uga2VlcCBpbXByb3ZpbmcuCgowMDowMDozOS45MjAgLS0+IDAwOjAwOjQxLjY1MApUaGVyZSBpcyBubyBmaXhlZCBvcmRlci4KCjAwOjAwOjQxLjcwMCAtLT4gMDA6MDA6NDYuNzMwCkEgYnJhbmQtbmV3IHRlYW0gdXN1YWxseSBzdGFydHMgd2l0aCBXaHkgYW5kIFdobywgYmVjYXVzZSBldmVyeXRoaW5nIGVsc2UgcmVzdHMgb24gdGhlbS4KCjAwOjAwOjQ2Ljc4MCAtLT4gMDA6MDA6NTIuNzkwCkJ1dCBhIHRlYW0gdGhhdOKAmXMgYmVlbiB0b2dldGhlciBmb3IgeWVhcnMgYW5kIGtlZXBzIHJlb3BlbmluZyBkZWNpc2lvbnMgc2hvdWxkIHByb2JhYmx5IHN0YXJ0IHdpdGggRGVjaXNpb25zLgoKMDA6MD ave opinions, responsibility and power. As the facilitator, your job is to help the team think together, and to make sure every voice is heard, not just the loudest one. And definitely not just yours.","The risk is simple. When the leader speaks first, the conversation is over. People adjust to what you said, often without noticing. So the first rule is: speak last. Ask the question, then wait. Let others go first. Add your view at the end, and frame it as one view among others.","The second rule is to name which hat you’re wearing. Say it out loud: “Now I’m taking off my facilitator hat for a moment, and speaking as your manager.” It sounds a bit formal the first time. But it helps people a lot, because they know when you’re guiding the process and when you’re giving direction.","Third: be clear about what is open and what is not. If some things are already decided, say so up front. Nothing damages trust faster than inviting people to shape something, and then overruling them. “We decide this together” and “I decide, but I want your input” are both fine. Just be honest about which one it is.","And finally, know when to hand the facilitator hat to someone else. If the topic is about you, your leadership, or a conflict you’re part of, ask a colleague, someone from HR, or an outside facilitator to guide that conversation. Then you can take part fully, as a team member.","Wearing two hats is a skill, and it gets easier with practice. Most teams appreciate it deeply when a leader steps back and lets them think."],"takeaways":["Speak last: ask, wait, and add your view at the end.","Say out loud which hat you’re wearing.","Be clear about what is open for discussion and what is already decided."],"try":"In your next regular meeting, ask one open question and stay silent until at least three people have answered.","downloads":["guide"],"visuals":[[0,"hats"],[4,"speaklast"],[9,"hats-fac"],[13,"open-closed"],[18,"handover"],[21,"hats"]],"video":"videos/01-01.mp4","captions":" lked about how we want to work together. I’d like us to spend two hours on that. No preparation needed, just come curious.” If you like, send the short intro video from formyourteam.dk along with it.","Avoid making it sound like a fix for a problem person, or a hidden agenda. People can smell that from far away, and they’ll stay guarded.","Third, the room. If you meet in person, book a room with wall space, and print the canvases in a big size. Bring plenty of post-its and thick markers, because thin pens make people write long sentences. Arrange chairs in a circle or a horseshoe, not facing a screen.","If you meet online, copy the Miro template, test it beforehand, and ask everyone to keep their camera on if they can. Online, give extra time for writing quietly, and be stricter with time boxes.","And one more thing: protect the time. No laptops for email, and no “I’ll just join for the first half.” If the session is important enough to run, it’s important enough to show up for."],"takeaways":["Write down: “After this session, we will have…”","Invite in your own words, with no hidden agenda.","Wall space, big canvases, thick markers, chairs in a circle."],"try":"Write the invitation for your first session. Read it out loud once. Would you want to come?","downloads":["guide","canvases","miro","workbook","templates","emails"],"visuals":[[0,"prep"],[2,"after-session"],[6,"prep-2"],[13,"prep-2"],[15,"room"],[20,"protect"]],"video":"videos/01-02.mp4","captions":"data:text/vtt;base64,V0VCVlRUCgowMDowMDowMy4xMjAgLS0+IDAwOjAwOjA1LjkzMApHb29kIHNlc3Npb25zIGFyZSB3b24gYmVmb3JlIHRoZXkgc3RhcnQuCgowMDowMDowNS45ODAgLS0+IDAwOjAwOjA4LjIxMApIZXJlIGFyZSB0aGUgdGhyZWUgdGhpbmdzIHRvIHByZXBhcmUuCgowMDowMDowOC4yNjAgLS0+IDAwOjAwOjE0LjYxMApGaXJzdCwgdGhlIHB1cnBvc2UuIEZpbmlzaCB0aGlzIHNlbnRlbmNlIGZvciB5b3Vyc2VsZjog4oCcQWZ0ZXIgdGhpcyBzZXNzaW9uLCB3ZSB3aWxsIGhhdmXigKbigJ0KCjAwOjAwOjE0LjY2MCAtLT4gMDA6MDA6MTguMTMwCkZvciBleGFtcGxlOiDigJzigKZhIGZpcnN0IHZlcnNpb24gb2Ygb3VyIHB1cnBvc2Ugc3RhdGVtZW50LuKAnQoKM  heard it, without derailing the session.","Closing. Never let a session just run out. Leave ten minutes at the end. Read back what you agreed. Ask: “Is there anything on here you can’t live with?” Agree who writes it up, and when you’ll look at it again.","And end with a check-out round: “What do you take with you?” It tells you how the session landed, and it ends things on a human note.","Opening, holding, closing. If you only remember one thing from this lesson: protect the ten minutes at the end."],"takeaways":["Open with a check-in round so every voice is heard early.","Hold with silent writing, rounds and visible time boxes.","Close by reading back agreements and checking out. Protect the last ten minutes."],"try":"Use a one-word check-in and a one-sentence check-out in your next team meeting.","downloads":["guide","workbook"],"visuals":[[0,"phases"],[2,"checkin"],[5,"frame"],[7,"phases-hold"],[9,"postits"],[12,"round"],[13,"timebox"],[16,"later"],[18,"close10"],[23,"checkout"],[25,"phases"]],"video":"videos/01-03.mp4","captions":"data:text/vtt;base64,V0VCVlRUCgowMDowMDowMy4wOTYgLS0+IDAwOjAwOjA4LjI2NgpFdmVyeSBzZXNzaW9uIGhhcyB0aHJlZSBwaGFzZXM6IG9wZW5pbmcsIGhvbGRpbmcgYW5kIGNsb3NpbmcuCgowMDowMDowOC4zMTYgLS0+IDAwOjAwOjEyLjA0NgpFYWNoIGhhcyBhIGZldyBzaW1wbGUgbW92ZXMgdGhhdCBtYWtlIGEgYmlnIGRpZmZlcmVuY2UuCgowMDowMDoxMi4wOTYgLS0+IDAwOjAwOjE3LjAyNgpPcGVuaW5nLiBTdGFydCB3aXRoIGEgY2hlY2staW46IGEgcXVpY2sgcm91bmQgd2hlcmUgZXZlcnlvbmUgc2F5cyBzb21ldGhpbmcuCgowMDowMDoxNy4wNzYgLS0+IDAwOjAwOjIwLjc4NgpGb3IgZXhhbXBsZTog4oCcSW4gb25lIHdvcmQsIGhvdyBkbyB5b3UgYXJyaXZlIHRvZGF5P+KAnQoKMDA6MDA6MjAuODM2IC0tPiAwMDowMDoyNy44MjYKSXQgc291bmRzIHNtYWxsLCBidXQgaXQgZ2V0cyBldmVyeSB2b2ljZSBpbnRvIHRoZSByb29tIGVhcmx5LCBhbmQgcGVvcGxlIHdobyBoYXZlIHNwb2tlbiBvbmNlIHNwZWFrIG1vcmUgZWFzaWx5IGxhdGVyLgoKMDA6MDA6MjcuODc2IC0tPiAwMDowMDozNC4wODYKVGhlbiBzYXkgd2h5IHlvdeKAmXJlIGhlcmUsIHdoYXQgeW914oCZbGwgZG8sIGFuZCB3aGF0IHlvdSBob3BlIHRvIGhhdmUgYXQgdGhlIGVuZC4gU2hvdyB0aGUgYWdlbmRhLgoKMDA6MDA6MzQuMTM2IC0tPiAwMDowMDo0MS4zMj de without owning it.","And finally: follow through. If people speak up and nothing changes, they will stop. Every agreement you capture and act on makes the next conversation more honest."],"takeaways":["Start with low-risk questions; build up to harder ones.","Your reaction to the first critical comment decides if there will be a second.","Follow-through is what makes the next conversation more honest."],"try":"Next time someone challenges you, say “Thank you, tell me more” before anything else.","downloads":["guide"],"visuals":[[2,"ladder"],[10,"anon"],[13,"tell-me-more"],[17,"quiet"],[22,"trust-loop"]],"video":"videos/01-04.mp4","captions":"data:text/vtt;base64,V0VCVlRUCgowMDowMDowMy4wOTYgLS0+IDAwOjAwOjA3LjQyNgpUaGVzZSBjb252ZXJzYXRpb25zIG9ubHkgd29yayBpZiBwZW9wbGUgc2F5IHdoYXQgdGhleSBhY3R1YWxseSB0aGluay4KCjAwOjAwOjA3LjQ3NiAtLT4gMDA6MDA6MTAuNjY2CkFuZCBpbiBtYW55IHRlYW1zLCB0aGF0IGRvZXNu4oCZdCBoYXBwZW4gYnkgaXRzZWxmLgoKMDA6MDA6MTAuNzE2IC0tPiAwMDowMDoxOS4wMDYKUHN5Y2hvbG9naWNhbCBzYWZldHkgbWVhbnMgcGVvcGxlIGJlbGlldmUgdGhleSB3b27igJl0IGJlIHB1bmlzaGVkIG9yIGVtYmFycmFzc2VkIGZvciBzcGVha2luZyB1cCwgYXNraW5nIGEgcXVlc3Rpb24sIG9yIGFkbWl0dGluZyBhIG1pc3Rha2UuCgowMDowMDoxOS4wNTYgLS0+IDAwOjAwOjIyLjcyNgpJdOKAmXMgYnVpbHQgc2xvd2x5LCBhbmQgaXQgY2FuIGJlIGRhbWFnZWQgaW4gYSBzZWNvbmQuCgowMDowMDoyMi43NzYgLS0+IDAwOjAwOjI2LjkwNgpBcyB0aGUgbGVhZGVyLCB5b3UgaGF2ZSBtb3JlIGluZmx1ZW5jZSBvbiBpdCB0aGFuIGFueW9uZSBlbHNlIGluIHRoZSByb29tLgoKMDA6MDA6MjYuOTU2IC0tPiAwMDowMDoyOS4yNjYKU28sIGEgZmV3IHByYWN0aWNhbCB0aGluZ3MuCgowMDowMDoyOS4zMTYgLS0+IDAwOjAwOjMyLjI0NgpTdGFydCB3aXRoIGxvdy1yaXNrIHF1ZXN0aW9ucyBhbmQgYnVpbGQgdXAuCgowMDowMDozMi4yOTYgLS0+IDAwOjAwOjM1LjMwNgpEb27igJl0IG9wZW4gd2l0aCDigJxXaGF04oCZcyB3cm9uZyB3aXRoIGhvdyB3ZSB3b3JrP+KAnQoKMDA6MDA6MzUuMzU2IC0tPiAwMDowMDozOC43NjYKT3BlbiB3aXRoIOKAnFdoYXTigJlzIG9uZSB0aGluZyB0aGF0IHdlbnQgd2VsbCB0aGlzIG1vbnRoP+KAnQoKMDA6MDA6MzguODE2IC0tPiAwMDowMDo0Mi41ODYKSG9uZXN0eSBncm93cyB3aGVuIHBlb3BsZSBoYXZlIGV4cGVyaWVuY2VkIHRoYXQgaXTigJlzIHNhZmUuCgowMDowMDo0Mi42MzYgLS0+IDAwOjAwOjQ1LjQ0Ng ","lessons":[{"id":"2-1","title":"Why purpose matters, and when your team needs it","min":1.57944445,"script":["The first conversation is about purpose: why does this team exist?","It sounds abstract, but it’s very practical. A clear purpose helps a team say no to the wrong work, make decisions faster, and explain to others what they’re for. Without it, every request looks equally important, and the team slowly turns into a group of people who happen to share a calendar.","How do you know your team needs this conversation? Here are four signs. People describe the team’s job very differently when you ask them. The team says yes to almost everything. New people take months to understand what the team is really for. Or people talk about tasks and projects, but never about who they’re doing it for.","The output of this conversation is two things on the canvas. First, a purpose statement: “We exist to… for… by…” Second, a picture of the future: what will this team have achieved in three years, and how will we notice it’s becoming real?","One warning before we start. Most purpose statements are terrible. They’re full of words like “excellence”, “value” and “synergies”, and nobody remembers them a week later. That’s because they’re written by committee, in organisational language, usually starting from a blank page.","The exercise in the next lesson avoids that, by starting from how people talk to their friends, not how they talk in strategy documents."],"takeaways":["Purpose helps a team say no, decide faster and explain itself.","Signs: different answers, saying yes to everything, slow onboarding.","Output: “We exist to… for… by…” plus a picture of success."],"try":"Ask three team members, separately: “In one sentence, why does our team exist?” Write their answers down word for word.","downloads":["guide","canvas-friend","canvas-future"],"visuals":[[2,"purpose-why"],[4,"signs-why"],[9,"statement"],[11,"dots"],[13,"buzzwords"]],"video":"videos/02-01.mp4","captions":"data: lish it during the break, and bring back two versions to choose from.","If you have time, add the second exercise: “In three years’ time…” Everyone writes two or three endings to that sentence. Group them, then give everyone three dots to vote. Ask them to vote for the version that feels true, not just ambitious. Then name two or three signs that would show it’s becoming real."],"takeaways":["Pairs explain the team as if to a friend over dinner; listeners capture phrases.","Cluster the phrases and circle the strongest words.","Draft “We exist to… for… by…”; let two volunteers polish if needed."],"try":"Run the four-minute “explain it to a friend” round yourself with one colleague before you run it with the team.","downloads":["guide","canvas-friend","canvas-future","workbook","templates"],"plan":{"title":"Session plan: Why are we here?","total":75,"rows":[[5,"Check-in round","“In one word: how do you arrive today?”"],[5,"Why we’re here, and what we’ll have at the end","“By the end, we’ll have a first version of our purpose, in our own words.”"],[10,"Explain it to a friend, in pairs (2 × 4 min)","“Explain our team the way you would to a good friend at dinner. Listeners: only write down phrases that sound clear and human.”"],[15,"Post-its on the canvas, cluster, circle the strongest words","“Which words keep coming back? Which ones would you be proud to say?”"],[15,"Draft “We exist to… for… by…”","“Good enough for now. We can polish the words later.”"],[15,"In three years’ time…, then dot vote","“Vote for the version that feels true, not just ambitious.”"],[10,"Read back, agree next steps, check-out","“What do you take with you from today?”"]]},"visuals":[[2,"pairtalk"],[13,"cluster"],[19,"statement"],[23,"dots"]],"video":"videos/02-02.mp4","captions":"data:text/vtt;base64,V0VCVlRUCgowMDowMDowMy4wOTYgLS0+IDAwOjAwOjA2LjUyNgpIZXJl4oCZcyBob3cgdG8gcnVuIHRoZSBleGVyY2lzZSDigJxFeHBsYWluIGl0IHRvIGEgZnJpZW5k4oCdLgoKMDA6MDA6MDYuNTc2IC0tPiAwMDowMDowOC44NjYKSXQgdGFrZXMgYWJvdXQgdH use the two-volunteer trick, and move on. A good-enough statement the team owns beats a perfect one nobody remembers.","Moment three: a real disagreement about what the team is for. For example, half the team thinks you serve internal stakeholders, the other half thinks you serve end customers. Don’t smooth this over. It’s gold. It’s probably the reason for friction you’ve been feeling for months. Write both versions down, and ask: “What would be different in our work if it were one or the other?” If it can’t be settled in the room, it may need a decision from you, or from your own manager.","And finally: test the result. Read the statement out loud and ask: “Would we say this to a friend? Does it help us say no to something?” If both answers are yes, write it on the canvas. You’re done for now."],"takeaways":["A given mandate still leaves room for what the team wants to be known for.","Stop wordsmithing: the meaning matters, the words can be polished later.","A real disagreement about purpose is gold. Make it visible."],"try":"Read your draft purpose out loud and ask the team: “Does this help us say no to something?”","downloads":["guide"],"visuals":[[1,"given"],[6,"wordsmith"],[12,"two-versions"],[18,"test"]],"video":"videos/02-03.mp4","captions":"data:text/vtt;base64,V0VCVlRUCgowMDowMDowMy4wODggLS0+IDAwOjAwOjA4LjEzOApMZXTigJlzIGxvb2sgYXQgdGhyZWUgbW9tZW50cyB0aGF0IG9mdGVuIGhhcHBlbiBpbiB0aGlzIGNvbnZlcnNhdGlvbiwgYW5kIHdoYXQgeW91IGNhbiBkby4KCjAwOjAwOjA4LjE4OCAtLT4gMDA6MDA6MTIuNDE4Ck1vbWVudCBvbmU6IOKAnE91ciBwdXJwb3NlIGlzIGp1c3Qgd2hhdCBvdXIgYm9zcyB0ZWxscyB1cy7igJ0KCjAwOjAwOjEyLjQ2OCAtLT4gMDA6MDA6MTcuMjk4ClNvbWUgdGVhbXMgZmVlbCB0aGVpciBwdXJwb3NlIGlzIGdpdmVuIHRvIHRoZW0gZnJvbSBhYm92ZS4gVGhhdOKAmXMgcGFydGx5IHRydWUuCgowMDowMDoxNy4zNDggLS0+IDAwOjAwOjI0LjIzOApCdXQgZXZlbiB3aXRoaW4gYSBnaXZlbiBtYW5kYXRlLCB0aGVyZeKAmXMgYSBsb3Qgb2Ygcm9vbSBmb3IgaG93IHRoZSB0ZWFtIHVuZGVyc3RhbmRzIGl0LCBhbmQgd2hvIHRoZXkgcmVhbGx5IHNlcnZlLgoKMDA6MDA6MjQuMjg4IC0tPiAwMDowMDoyNy4yNTgKU2F5OiDigJxZb3XigJlyZSBya s first."],"takeaways":["Without knowing each other, people fill gaps with assumptions.","Signs: new joiners, little help-seeking, repeated misunderstandings.","Start with the personal user manual; add the story exercise for new teams."],"try":"Write your own personal user manual first, so you can share it as an example.","downloads":["guide","canvas-manual","canvas-skills"],"visuals":[[1,"six"],[3,"assumptions"],[6,"signs-who"],[10,"canvas"],[11,"who-exercises"]],"video":"videos/03-01.mp4","captions":"data:text/vtt;base64,V0VCVlRUCgowMDowMDowMy4xMDggLS0+IDAwOjAwOjA2Ljk5OApUaGUgc2Vjb25kIGNvbnZlcnNhdGlvbiBpcyBhYm91dCBwZW9wbGU6IHdobyBhcmUgd2U/CgowMDowMDowNy4wNDggLS0+IDAwOjAwOjA5LjExOApUZWFtcyBhcmUgbm90IG9yZyBjaGFydHMuCgowMDowMDowOS4xNjggLS0+IDAwOjAwOjE0LjIzOApUaGV5IGFyZSBwZW9wbGUgd2l0aCBkaWZmZXJlbnQgc3RyZW5ndGhzLCB3YXlzIG9mIHdvcmtpbmcsIGFuZCB0aGluZ3MgZ29pbmcgb24gaW4gdGhlaXIgbGl2ZXMuCgowMDowMDoxNC4yODggLS0+IDAwOjAwOjE4LjI1OApXaGVuIHRlYW1tYXRlcyBkb27igJl0IGtub3cgZWFjaCBvdGhlciwgdGhleSBmaWxsIHRoZSBnYXBzIHdpdGggYXNzdW1wdGlvbnMuCgowMDowMDoxOC4zMDggLS0+IDAwOjAwOjI0LjA5OApBbmQgYXNzdW1wdGlvbnMgYXJlIHdoZXJlIG1vc3QgZnJpY3Rpb24gY29tZXMgZnJvbTog4oCcU2hlIG5ldmVyIGFuc3dlcnMgcXVpY2tseSwgc2hlIG11c3Qgbm90IGNhcmUu4oCdCgowMDowMDoyNC4xNDggLS0+IDAwOjAwOjI4LjM3OApXaGVuIGFjdHVhbGx5LCBzaGUgbmVlZHMgYW4gaG91ciBvZiBxdWlldCBiZWZvcmUgc2hlIHJlcGxpZXMgdG8gYW55dGhpbmcuCgowMDowMDoyOC40MjggLS0+IDAwOjAwOjMzLjA1OApTaWducyB5b3VyIHRlYW0gbmVlZHMgdGhpcyBjb252ZXJzYXRpb246IG5ldyBwZW9wbGUgaGF2ZSBqb2luZWQgcmVjZW50bHkuCgowMDowMDozMy4xMDggLS0+IDAwOjAwOjM2Ljc5OApQZW9wbGUgd29yayBzaWRlIGJ5IHNpZGUgYnV0IHJhcmVseSBhc2sgZWFjaCBvdGhlciBmb3IgaGVscC4KCjAwOjAwOjM2Ljg0OCAtLT4gMDA6MDA6NDEuMDk4Ck1pc3VuZGVyc3RhbmRpbmdzIGtlZXAgaGFwcGVuaW5nIGFib3V0IGhvdyBwZW9wbGUgcHJlZmVyIHRvIGNvbW11bmljYXRlLgoKMDA6MDA6NDEuMTQ4IC0tPiAwMDowMDo0Ni40MTgKT3IgdGhlIHRlYW0gb25seSBrbm93cyBlYWNoIG90aGVy4oCZcyBqb2IgdGl0bGVzLCBub3Qgd2hhdCBlYWNoIHBlcnNvbiBpcyBncmVhdCBhdC4KCjAwOjAwOjQ2LjQ2OCAtLT4gMDA6MDA6NTUuMDk4ClRoZSBvdXRwdXQgb24gdGhlIGNhbnZhcyBpcyB0aHJlZSB  their initials, stuck on the canvas in the right box. Quiet writing time matters here. These are personal questions, and people need a moment to think.","Next, put people in pairs. Each person talks through their manual. The listener asks one question to understand better, not to challenge. For example: “What does good feedback look like for you, concretely?”","Finally, come back together and ask each pair for one surprising or useful insight. Not the whole manual, just one thing. You’ll often hear things like: “I had no idea you preferred written feedback.” Those small discoveries are the point.","After the session, keep the manuals somewhere everyone can find them, and tell new joiners to write theirs in their first week. A manual is most useful three months later, when someone is about to give feedback and remembers to check."],"takeaways":["Go first with an honest manual; you set the level of openness.","Ten minutes of quiet writing, then pairs: one question to understand.","Share one surprising insight per pair, not the whole manual."],"try":"Share your own manual with one person on your team this week and ask for one question back.","downloads":["guide","canvas-manual","workbook","templates"],"plan":{"title":"Session plan: Who are we?","total":70,"rows":[[5,"Check-in round","“Something people here might not know about you.”"],[5,"Share your own personal user manual first","“I’ll go first, and I’ll be honest about the pressure one.”"],[10,"Everyone writes their manual, in silence","“One post-it per prompt. Share what you’re comfortable with.”"],[20,"Pairs: talk it through, one question each","“Ask one question to understand, not to challenge.”"],[15,"Each pair shares one surprising or useful insight","“Not the whole manual. Just one thing you learned.”"],[5,"Agree where the manuals live, and how new joiners add theirs",""],[10,"Check-out","“What will you do differently with someone in this room?”"]]},"visuals":[[2,"manual"],[7,"manual-flow"],[10,"postits"],[14  a confrontation. Acknowledge it: “That sounds important. Let’s make sure we come back to it in the decisions conversation.” Then do come back to it.","One more thing about the skills marketplace, if you use it. It works best when you end with a concrete pairing: who learns what from whom in the next few weeks. Without that, it stays a nice list on a wall.","And remember: this conversation is never done. Every time someone joins or leaves, the answer to “who are we?” changes. That’s a good moment to repeat it."],"takeaways":["Sharing is always optional; pressure backfires.","Go one level deeper with “when it really matters…”","Acknowledge painful comments and link them to the right conversation."],"try":"Plan how you’ll respond if someone shares something that’s about you. Write down your first sentence.","downloads":["guide","canvas-skills"],"visuals":[[1,"optional"],[6,"deeper"],[11,"come-back"],[17,"pairing"],[20,"six"]],"video":"videos/03-03.mp4","captions":"data:text/vtt;base64,V0VCVlRUCgowMDowMDowMy4xMDggLS0+IDAwOjAwOjA2LjgxOApUaHJlZSB0cmlja3kgbW9tZW50cyBpbiB0aGUg4oCcV2hvIGFyZSB3ZT/igJ0gY29udmVyc2F0aW9uLgoKMDA6MDA6MDYuODY4IC0tPiAwMDowMDowOS45NTgKTW9tZW50IG9uZTogc29tZW9uZSBkb2VzbuKAmXQgd2FudCB0byBzaGFyZS4KCjAwOjAwOjEwLjAwOCAtLT4gMDA6MDA6MTIuNDk4ClRoYXTigJlzIGZpbmUsIGFuZCBpdCBzaG91bGQgYmUgZmluZS4KCjAwOjAwOjEyLjU0OCAtLT4gMDA6MDA6MTYuMzc4CkFsd2F5cyBtYWtlIHNoYXJpbmcgb3B0aW9uYWw6IOKAnFNoYXJlIHdoYXQgeW914oCZcmUgY29tZm9ydGFibGUgd2l0aC7igJ0KCjAwOjAwOjE2LjQyOCAtLT4gMDA6MDA6MTkuMjE4ClB1c2hpbmcgcGVvcGxlIHRvIGJlIHZ1bG5lcmFibGUgYmFja2ZpcmVzLgoKMDA6MDA6MTkuMjY4IC0tPiAwMDowMDoyMi42NTgKTW9zdCBwZW9wbGUgb3BlbiB1cCBtb3JlIHdoZW4gdGhleSBmZWVsIHRoZXkgZG9u4oCZdCBoYXZlIHRvLgoKMDA6MDA6MjIuNzA4IC0tPiAwMDowMDoyNi4wNzgKTW9tZW50IHR3bzogdGhlIGFuc3dlcnMgc3RheSBvbiB0aGUgc3VyZmFjZS4KCjAwOjAwOjI2LjEyOCAtLT4gMDA6MDA6MjguOTU4CuKAnFlvdSBnZXQgdGhlIGJlc3QgZnJvbSBtZSB3aGVuIHRoZXJl4oCZcyBjb2ZmZWUu4oCdCgowMDowMDoyOS4wMDggLS0+IDAwOjAwOjMwLjczOApIdW1vdXIgaXMgYSBub3JtYWwgZmlyc3Qgc3RlcC4KCjAwOjAwOjMwLjc4OC ew, and what can go.","lessons":[{"id":"4-1","title":"Rhythm, or just a full calendar?","min":1.50055555,"script":["The third conversation is about rhythm: how do we work?","Most teams don’t have a rhythm. They have a calendar. Meetings were added over time, each for a good reason, and nobody ever took one away. The result: lots of meetings, and still the feeling that the important conversations never happen.","A good rhythm is simple. It has three moments: when you plan, when you make, and when you review. Planning is where you decide what matters most. Making is the time to actually do the work, ideally protected. And reviewing is where you look at what you did, and learn from it.","Signs your team needs this conversation: the calendar is full but priorities are unclear. People say “we should have talked about this earlier.” Deep work happens in the evenings. Or nobody can remember the last time the team looked back at how things went.","The output on the canvas is short. When and how we plan. When and how we make. When and how we review. And a list of meetings and habits we’re dropping.","That last list is often the most popular part of the whole course. People love dropping meetings. But be thoughtful. Every meeting was created to solve a problem. Before you drop it, ask: “What problem was this solving, and how will we solve it now?”"],"takeaways":["Most teams have a calendar, not a rhythm.","A good rhythm has three moments: plan, make, review.","Before dropping a meeting, ask what problem it was solving."],"try":"List every recurring meeting your team has. Next to each one, write the problem it was created to solve.","downloads":["guide","canvas-heartbeat"],"visuals":[[1,"calendar"],[4,"loop"],[6,"loop-plan"],[7,"loop-make"],[8,"loop-review"],[9,"signs-rhythm"],[16,"drop-ask"]],"video":"videos/04-01.mp4","captions":"data:text/vtt;base64,V0VCVlRUCgowMDowMDowMy4wNzIgLS0+IDAwOjAwOjA3LjIyMgpUaGUgdGhpcmQgY29udmVyc2F0aW9uIGlzIGFib3V0IHJoeXRobTogaG93IGRvIHdlIHdvcms/Cg  existing meeting and habit on the plan–make–review loop.","Mark each one keep, change, combine or remove. Move quickly.","Agree when each moment happens, and try it for one cycle."],"try":"Draw your team’s loop on your own first, with the meetings you know about. Where is the crowd?","downloads":["guide","canvas-heartbeat","workbook","templates"],"plan":{"title":"Session plan: How do we work?","total":75,"rows":[[5,"Check-in round","“One meeting you’d miss, and one you wouldn’t.”"],[5,"Draw the loop: plan, make, review","“Every team goes through this loop, whether they plan it or not.”"],[10,"Everyone writes the meetings and habits we have today","“One per post-it. Include the informal ones.”"],[10,"Place them on the loop, then look at the pattern","“What do you notice?”"],[15,"Keep, change, combine or remove: one by one, quickly","“What problem was this meeting solving?”"],[20,"Agree when and how we plan, make and review","“Let’s try this for one cycle, then look at it again.”"],[10,"Read back, put the review in the calendar, check-out",""]]},"visuals":[[2,"loop"],[4,"postits"],[7,"loop-crowd"],[10,"kcc"],[12,"calendar-protected"],[16,"loop"]],"video":"videos/04-02.mp4","captions":"data:text/vtt;base64,V0VCVlRUCgowMDowMDowMy4wNzIgLS0+IDAwOjAwOjA1LjgwMgpIZXJl4oCZcyBob3cgdG8gcnVuIOKAnERyYXcgeW91ciB0ZWFt4oCZcyBsb29w4oCdLgoKMDA6MDA6MDUuODUyIC0tPiAwMDowMDoxMC43NjIKSXQgdGFrZXMgYWJvdXQgdGhpcnR5IG1pbnV0ZXMsIGlkZWFsbHkgYXQgYSB3aGl0ZWJvYXJkIG9yIG9uIHRoZSBiaWcgY2FudmFzLgoKMDA6MDA6MTAuODEyIC0tPiAwMDowMDoxNS45MDIKRHJhdyBhIGxvb3A6IHBsYW4sIHRoZW4gbWFrZSwgdGhlbiByZXZpZXcsIHRoZW4gYmFjayB0byBwbGFuLgoKMDA6MDA6MTUuOTUyIC0tPiAwMDowMDoyMS44NDIKRXhwbGFpbiBpdCBpbiBvbmUgc2VudGVuY2U6IGV2ZXJ5IHRlYW0gZ29lcyB0aHJvdWdoIHRoaXMgbG9vcCwgd2hldGhlciB0aGV5IHBsYW4gaXQgb3Igbm90LgoKMDA6MDA6MjEuODkyIC0tPiAwMDowMDoyNy4zNjIKTm93IGFzayBldmVyeW9uZSB0byB3cml0ZSB0aGUgbWVldGluZ3MgYW5kIGhhYml0cyB0aGUgdGVhbSBhbHJlYWR5IGhhcywgb25lIHBlciBwb3N0LWl0LgoKMDA6MDA6MjcuNDEyIC0tPiAwMDowMDozMy4xNjIKU3RhbmQtdXBzLCB3ZWVrbHkg endar-protected"]},{"id":"4-3","title":"Tricky moments in the rhythm conversation","min":1.6484999999999999,"script":["Three tricky moments in the rhythm conversation.","Moment one: the meeting nobody likes, but nobody can drop. Usually it’s one that someone outside the team expects, like a status report for a steering group. Don’t pretend you can drop it. Ask instead: “How can we make it cost us less?” Often it can become a written update, shared once a week.","Moment two: different people need different rhythms. Some love daily check-ins, others find them a waste of time. Some need long stretches of focus, others work in short bursts. That’s normal. Look for a minimum shared rhythm, and let the rest be flexible. You can use what you learned in the “Who are we?” conversation here.","Moment three: the review doesn’t happen. This is the most common outcome. Teams agree to a review moment, and after two weeks it’s the first meeting to be cancelled when things get busy. Protect it. Put it in the calendar right away, keep it short, and make it concrete: look at real work, not slides.","One more tip: be careful with the “remove” pile. Removing meetings feels great in the room. But if a meeting was the only place where some people got information, removing it can leave them out. For every meeting you drop, ask: “Who might miss something, and how will they hear about it now?”","And after one cycle, come back to it. Ten minutes is enough: what worked, what didn’t, what do we change?"],"takeaways":["Can’t drop it? Make it cost less, for example as a written update.","Find a minimum shared rhythm; let the rest be flexible.","Protect the review moment. It’s the first to be cancelled."],"try":"Pick one meeting your team could turn into a written update, and suggest it.","downloads":["guide"],"visuals":[[1,"cost-less"],[6,"calendar"],[11,"loop-review"],[15,"who-misses"],[19,"timebox"]],"video":"videos/04-03.mp4","captions":"data:text/vtt;base64,V0VCVlRUCgowMDowMDowMy4xMTIgLS0+ID ons, like dot voting. Some help you decide quickly, like majority vote or one person with authority. Some bring everyone along, like consent or fist to five. And some settle who has the final say, like delegation.","No method is best. Consensus is great when everyone must carry the decision, but it’s slow. Authority is fast, but people may not commit. The skill is to choose the method on purpose, before the discussion starts, instead of discovering it at the end."],"takeaways":["The problem is often unclear decisions, not bad ones.","Signs: topics keep coming back, everything goes up to the manager.","Choose how you’ll decide before the discussion starts."],"try":"Write down three decisions your team made in the last month. For each, who actually decided, and how?","downloads":["guide","canvas-decisions"],"visuals":[[1,"signs-decide"],[8,"deccard"],[10,"mech"],[12,"mech-0"],[13,"mech-1"],[14,"mech-2"],[15,"mech-3"],[16,"mech"]],"video":"videos/05-01.mp4","captions":"data:text/vtt;base64,V0VCVlRUCgowMDowMDowMy4xMTIgLS0+IDAwOjAwOjA3LjQ2MgpUaGUgZm91cnRoIGNvbnZlcnNhdGlvbiBpcyBhYm91dCBkZWNpc2lvbnM6IGhvdyBkbyB3ZSBtYWtlIHRoZW0/CgowMDowMDowNy41MTIgLS0+IDAwOjAwOjEyLjM4MgpJbiBtYW55IHRlYW1zLCB0aGUgcHJvYmxlbSBpc27igJl0IGJhZCBkZWNpc2lvbnMuIEl04oCZcyB1bmNsZWFyIG9uZXMuCgowMDowMDoxMi40MzIgLS0+IDAwOjAwOjE4LjMwMgpOb2JvZHkgaXMgcXVpdGUgc3VyZSB3aG8gZGVjaWRlcywgc28gZGVjaXNpb25zIGdldCBtYWRlIGluIGhhbGx3YXlzLCBvciBub3QgYXQgYWxsLgoKMDA6MDA6MTguMzUyIC0tPiAwMDowMDoyMy4zNjIKT3IgdGhleSBnZXQgbWFkZSwgYW5kIHRoZW4gcmVvcGVuZWQgYXQgdGhlIG5leHQgbWVldGluZywgYmVjYXVzZSBzb21lb25lIHdhc27igJl0IGFza2VkLgoKMDA6MDA6MjMuNDEyIC0tPiAwMDowMDoyOC41MDIKSGVyZSBhcmUgdGhlIHNpZ25zLiBUaGUgc2FtZSB0b3BpYyBzaG93cyB1cCBvbiB0aGUgYWdlbmRhIGFnYWluIGFuZCBhZ2Fpbi4KCjAwOjAwOjI4LjU1MiAtLT4gMDA6MDA6MzIuNjgyClBlb3BsZSBhc2sg4oCcd2hvIGRlY2lkZWQgdGhpcz/igJ0gbW9yZSBvZnRlbiB0aGFuIOKAnHdoeT/igJ0uCgowMDowMDozMi43MzIgLS0+IDAwOjAwOjM2LjEyMgpFdmVyeXRoaW5nIGdvZXMgdXAgdG8gdGhlIG1hbmFnZXIsIGV2ZW4gc21hbGwgdGhpbmdzLgoKMDA6MDA6MzYuMTcyIC0tPiAwMDowMD the team. One per post-it. Things like: what we work on next, who joins which project, how we spend the budget, when we say no to a request.","Put them up, cluster the similar ones, and pick one that matters to the team. Choose one that causes some friction today. That way the result is immediately useful.","Now read the twelve ways to decide together. For each group, ask one question. Does this decision need narrowing down? Does it need speed? Does it need everyone on board? Or does it need a clear final say?","Then choose one method for this decision. Write it on the canvas, together with who decides, who should be asked first, and who should be told afterwards.","Here’s an example. “What we work on next month: the team proposes, our product owner decides by consent. We ask our two main stakeholders before. We tell everyone in the planning meeting.” Short, clear, and anyone can check it.","If you have time, do a second or third decision. But one good one is better than five vague ones.","And finally, agree to try it the next few times the decision comes up, then talk about how it felt. Like the rhythm, a decision method is an experiment. You keep it if it works."],"takeaways":["Collect decisions that come up often; pick one that causes friction.","Ask what it needs: narrowing, speed, everyone on board, or a final say.","Write down who decides, who is asked, who is told, and how."],"try":"Pick the decision that comes back most often in your team, and choose a method for it before your session.","downloads":["guide","canvas-decisions","workbook","templates"],"plan":{"title":"Session plan: How do we make decisions?","total":75,"rows":[[5,"Check-in round","“A decision this month that went well, and why.”"],[10,"Everyone writes decisions that come up again and again","“One per post-it. Small ones count too.”"],[10,"Cluster and pick one that causes friction today",""],[15,"Read the twelve ways to decide together","“Does this need narrowing, speed, everyone on board, or ne’s first choice.","Moment three: the decision is not yours to give. Some decisions belong to people outside the team: your manager, another department, a steering group. Don’t pretend otherwise. Write them on the canvas too, with the real owner. It’s useful for the team to see where their influence ends, and where they can still give input.","And a tip for after the session. Write decisions down when you make them. A simple decision log, with the date, what was decided, by whom and why, ends a lot of “who decided this?” conversations before they start.","If someone wants to reopen a decision, that’s allowed. But ask: “What new information do we have?” If there isn’t any, the decision stands."],"takeaways":["Be clear which decisions you keep, and really hand over the rest.","Offer consent when consensus slows everything down.","Reopen decisions only with new information."],"try":"Start a simple decision log for your team: date, decision, who, why.","downloads":["guide"],"visuals":[[1,"keep-hand"],[7,"consent"],[11,"deccard"],[16,"log"],[19,"new-info"]],"video":"videos/05-03.mp4","captions":"data:text/vtt;base64,V0VCVlRUCgowMDowMDowMy4xMjAgLS0+IDAwOjAwOjA2LjM1MApUaHJlZSB0cmlja3kgbW9tZW50cyB3aGVuIHlvdSB0YWxrIGFib3V0IGRlY2lzaW9ucy4KCjAwOjAwOjA2LjQwMCAtLT4gMDA6MDA6MTAuMDMwCk1vbWVudCBvbmU6IOKAnEJ1dCB5b3XigJlyZSB0aGUgbWFuYWdlciwgeW91IGRlY2lkZS7igJ0KCjAwOjAwOjEwLjA4MCAtLT4gMDA6MDA6MTQuNTUwClNvbWUgdGVhbXMgZXhwZWN0IHlvdSB0byBkZWNpZGUgZXZlcnl0aGluZywgYW5kIHNvbWUgbWFuYWdlcnMgbGlrZSB0aGF0LgoKMDA6MDA6MTQuNjAwIC0tPiAwMDowMDoxNy45MzAKQnV0IGl0IG1ha2VzIHlvdSBhIGJvdHRsZW5lY2ssIGFuZCB0aGUgdGVhbSBzdG9wcyB0aGlua2luZy4KCjAwOjAwOjE3Ljk4MCAtLT4gMDA6MDA6MjEuODcwCkJlIGNsZWFyIGFib3V0IHdoaWNoIGRlY2lzaW9ucyB5b3Uga2VlcCwgYW5kIHdoaWNoIHlvdSBoYW5kIG92ZXIuCgowMDowMDoyMS45MjAgLS0+IDAwOjAwOjI0LjAzMApUaGVuIHJlYWxseSBoYW5kIHRoZW0gb3Zlci4KCjAwOjAwOjI0LjA4MCAtLT4gMDA6MDA6MjguNzMwCklmIHlvdSBvdmVycnVsZSBhIGRlbGVnYXRlZCBkZWNpc2lvbiBvbmNlLCBwZW9wbGUgd2lsbCBzdG9wIGJlbGlldmluZyB5b3UuCgowMDowMDoyOC43ODAgLS0+ID oster.jpg","secs":100.366667,"dur":"1:40","glance":["keep-hand","consent","log"]}]},{"id":"m6","n":6,"key":"agree","title":"How do we want to be together?","step":5,"intro":"Values as visible behaviours: what belongs in this team, and what doesn’t.","lessons":[{"id":"6-1","title":"From nice words to visible behaviours","min":1.4951666666666665,"script":["The fifth conversation is about how we treat each other: how do we want to be together?","Most organisations have values. Trust, respect, ownership. They’re on posters and in slide decks. And almost nobody can tell you what they mean on a Tuesday afternoon, when a deadline is close and someone just missed a meeting.","That’s why this conversation is not about values as words. It’s about behaviours you could actually see. Not “we respect each other”, but “we let people finish their sentence”. Not “we trust each other”, but “we say it to the person, not about the person”.","Signs your team needs this conversation: there’s tension that nobody names. People complain to you, but not to each other. Some behaviour bothers several people, but everyone tolerates it. Or new people don’t know the unwritten rules, and keep stepping on them.","The output on the canvas is a short team contract, with two parts: the behaviours that belong in this team, and the behaviours that don’t. In and out.","This conversation is especially valuable after the “Who are we?” conversation, because people already know more about each other. And it’s especially hard when there is conflict in the team. If the tension is about you, or about one person, think about bringing in someone else to facilitate it."],"takeaways":["Talk about behaviours you could see, not values as words.","Signs: unnamed tension, complaints to you rather than each other.","Output: a short contract of what’s in, and what’s out."],"try":"Write one of your organisation’s values, then three behaviours that would show it in your team.","downloads":["guide","canvas-contract"],"visua t behaviours, using dots. A short contract that people remember is far better than a long one they don’t.","End by asking: “Can everyone live with this?” And one more question: “What will we do when someone breaks it?” Agree on that now, while it’s easy."],"takeaways":["IN: what people do when the team is at its best. OUT: what undermines it.","Rewrite every behaviour until you could see it happen.","Keep five to eight, and agree what happens when one is broken."],"try":"Take one vague value your team uses, and rewrite it as a behaviour you could see.","downloads":["guide","canvas-contract","workbook","templates"],"plan":{"title":"Session plan: How do we want to be together?","total":90,"rows":[[5,"Check-in round","“A moment this team was at its best.”"],[5,"Draw two circles: IN and OUT",""],[15,"IN: behaviours we want to practise and protect","“What were people doing when we were at our best? Start with a verb.”"],[15,"OUT: behaviours that undermine trust, inclusion or good work","“Behaviours, not people.”"],[20,"Rewrite until you could see it happen","“Could you tell if someone is doing this?”"],[10,"Dot vote: keep the five to eight that matter most",""],[10,"Can everyone live with this? What do we do when it’s broken?",""],[10,"Check-out",""]]},"visuals":[[2,"inout-empty"],[3,"inout-in"],[11,"inout-all"],[15,"rewrite"],[20,"reduce"]],"video":"videos/06-02.mp4","captions":"data:text/vtt;base64,V0VCVlRUCgowMDowMDowMy4wODAgLS0+IDAwOjAwOjA1Ljk1MApIZXJl4oCZcyBob3cgdG8gcnVuIHRoZSB0d28tY2lyY2xlIHRlYW0gY29udHJhY3QuCgowMDowMDowNi4wMDAgLS0+IDAwOjAwOjA4LjE5MApQbGFuIGFib3V0IGZvcnR5LWZpdmUgbWludXRlcy4KCjAwOjAwOjA4LjI0MCAtLT4gMDA6MDA6MTQuMTkwCkRyYXcgdHdvIGxhcmdlIGNpcmNsZXMgb24gdGhlIHdhbGwsIG9yIHVzZSB0aGUgY2FudmFzLCBhbmQgbGFiZWwgdGhlbSBJTiBhbmQgT1VULgoKMDA6MDA6MTQuMjQwIC0tPiAwMDowMDoxOS42OTAKU3RhcnQgd2l0aCBJTi4gQXNrOiDigJxUaGluayBvZiBhIG1vbWVudCB3aGVuIHRoaXMgdGVhbSB3YXMgYXQgaXRzIGJlc3QuCgowMDowMDoxOS43NDAgLS0+IDAwOjAwOjIxLjE1MApXaGF0IHdlcmUgcGVvcGxlIGRvaW5nP+KAnQoKMDA6MDA6MjEuM it.” It turns criticism into a shared standard.","Look at the contract again every few months, or when someone joins. Is it still true? What’s missing?"],"takeaways":["Keep the focus on the behaviour, never the person.","A too-polite contract means people don’t feel safe yet.","Refer to the contract, not your opinion. And admit when you break it."],"try":"Notice one behaviour in your team this week that you’d put in IN. Tell the person you saw it.","downloads":["guide"],"visuals":[[1,"behaviour"],[7,"missing"],[13,"after-hours"],[18,"contract-use"]],"video":"videos/06-03.mp4","captions":"data:text/vtt;base64,V0VCVlRUCgowMDowMDowMy4wNzAgLS0+IDAwOjAwOjA2LjM0MApUaHJlZSB0cmlja3kgbW9tZW50cyBpbiB0aGUgdmFsdWVzIGNvbnZlcnNhdGlvbi4KCjAwOjAwOjA2LjM5MCAtLT4gMDA6MDA6MTAuNTgwCk1vbWVudCBvbmU6IGEgcG9zdC1pdCBpcyBjbGVhcmx5IGFib3V0IG9uZSBwZXJzb24uCgowMDowMDoxMC42MzAgLS0+IDAwOjAwOjE0LjU2MApFdmVyeW9uZSBrbm93cyB3aG8g4oCcaW50ZXJydXB0cyBvdGhlcnMgaW4gbWVldGluZ3PigJ0gaXMgYWJvdXQuCgowMDowMDoxNC42MTAgLS0+IDAwOjAwOjE3LjgzOQpEb27igJl0IG5hbWUgdGhlIHBlcnNvbiwgYW5kIGRvbuKAmXQgcmVtb3ZlIHRoZSBwb3N0LWl0LgoKMDA6MDA6MTcuODg5IC0tPiAwMDowMDoyMi40MDAKS2VlcCB0aGUgZm9jdXMgb24gdGhlIGJlaGF2aW91cjog4oCcVGhpcyBpcyBzb21ldGhpbmcgd2UgYWxsIGRvIHNvbWV0aW1lcy4KCjAwOjAwOjIyLjQ1MCAtLT4gMDA6MDA6MjQuNTgwCkRvIHdlIGFncmVlIGl0IGJlbG9uZ3MgaW4gT1VUP+KAnQoKMDA6MDA6MjQuNjMwIC0tPiAwMDowMDoyOS4yMjAKSWYgbmVlZGVkLCBmb2xsb3cgdXAgd2l0aCB0aGUgcGVyc29uIHByaXZhdGVseSBhZnRlcndhcmRzLCB3aXRoIGNhcmUuCgowMDowMDoyOS4yNzAgLS0+IDAwOjAwOjMyLjY2MApNb21lbnQgdHdvOiB0aGUgY29udHJhY3QgaXMgdG9vIHBvbGl0ZS4KCjAwOjAwOjMyLjcxMCAtLT4gMDA6MDA6MzYuNzIwCkV2ZXJ5dGhpbmcgaW4gaXQgaXMgbmljZSwgYW5kIG5vdGhpbmcgaW4gaXQgaXMgYSByZWFsIGNoYW5nZS4KCjAwOjAwOjM2Ljc3MCAtLT4gMDA6MDA6NDAuMDQwClRoYXQgdXN1YWxseSBtZWFucyBwZW9wbGUgZG9u4oCZdCBmZWVsIHNhZmUgZW5vdWdoIHlldC4KCjAwOjAwOjQwLjA5MCAtLT4gMDA6MDA6NDUuMDgwClRyeSBhc2tpbmc6IOKAnFdoYXTigJlzIG9uZSBiZWhhdmlvdXIgdGhhdCBoYXBwZW5zIGhlcmUsIHRoYXQgd2UgaGF2ZW7igJl0IHdyaXR0ZW4gZG93bj/igJ0KCjAwOjAwOjQ1LjEzMCAtLT4gMDA6MDA6NDcuMDgwClRoZW4gZ2l2 ipt":["The sixth conversation is about change: how do we learn and reform?","Teams are never finished. People join and leave. Priorities change. The organisation reorganises. What worked six months ago may be in the way today. A team that never stops to look at itself slowly drifts, and nobody notices until it hurts.","Signs your team needs this conversation: something has changed, like a new team member, a new leader or a new strategy, and you haven’t talked about what it means for the team. Agreements from earlier sessions are quietly being ignored. The team feels tired, or stuck in habits. Or it’s simply been more than six months since you last looked at your canvas.","The output on the canvas is three short lists. Keep: what should we protect? Change: what is no longer helping us? Try: what small experiment will we run next? And one more thing: what should make us sit down with the canvas again?","This conversation can stand on its own, like a retrospective. But it’s most powerful when you use it to look back at the other five. Walk past the canvas: is our purpose still true? Do our decision rules still work? Is our contract still alive?","In that way, the sixth conversation is what makes the other five last."],"takeaways":["Teams are never finished. Without looking back, they drift.","Signs: something changed, agreements are quietly ignored.","Use it to look back at the other five conversations."],"try":"Look at whatever your team agreed most recently. Is it still true? Is it still used?","downloads":["guide","canvas-kct"],"visuals":[[1,"drift"],[6,"signs-evolve"],[10,"kct"],[15,"canvas"]],"video":"videos/07-01.mp4","captions":"data:text/vtt;base64,V0VCVlRUCgowMDowMDowMy4xMTAgLS0+IDAwOjAwOjA4LjA2MApUaGUgc2l4dGggY29udmVyc2F0aW9uIGlzIGFib3V0IGNoYW5nZTogaG93IGRvIHdlIGxlYXJuIGFuZCByZWZvcm0/CgowMDowMDowOC4xMTAgLS0+IDAwOjAwOjEwLjAyMApUZWFtcyBhcmUgbmV2ZXIgZmluaXNoZWQuCgowMDowMDoxMC4wNzAgLS0+IDAwOjAwOjEzLjIyMApQZW9wbGUgam9pbiBhbmQgbGVhdmUuIFByaW9yaXRpZXMgY2hhbmdlLgoKMD earn and reform?","total":60,"rows":[[5,"Check-in round","“What’s changed for you since we last talked about the team?”"],[5,"Walk past the canvas, if you have one","“Is this still true?”"],[10,"Keep: write, then a round","“What about this team should we protect?”"],[10,"Change: write, then a round","“What is no longer helping us?”"],[15,"Try: choose one or two small experiments","“What exactly will we do, from when, and who keeps an eye on it?”"],[5,"What should make us sit down with the canvas again?",""],[10,"Read back and check-out",""]]},"visuals":[[2,"canvas"],[4,"kct-keep"],[8,"kct-change"],[11,"kct-try"],[14,"experiment"],[18,"triggers"]],"video":"videos/07-02.mp4","captions":"data:text/vtt;base64,V0VCVlRUCgowMDowMDowMy4wNzAgLS0+IDAwOjAwOjA1LjcyMApIZXJl4oCZcyBob3cgdG8gcnVuIEtlZXAsIENoYW5nZSwgVHJ5LgoKMDA6MDA6MDUuNzcwIC0tPiAwMDowMDowNy42MDAKSXQgdGFrZXMgYWJvdXQgdGhpcnR5IG1pbnV0ZXMuCgowMDowMDowNy42NTAgLS0+IDAwOjAwOjEyLjY2MApQcmVwYXJlIGJ5IHB1dHRpbmcgdGhlIHRlYW0gY2FudmFzIG9uIHRoZSB3YWxsLCBvciBzaGFyaW5nIGl0IG9uIHNjcmVlbiwgaWYgeW91IGhhdmUgb25lLgoKMDA6MDA6MTIuNzEwIC0tPiAwMDowMDoxNi4yMDAKSWYgbm90LCB0aGF04oCZcyBmaW5lOiB0aGUgZXhlcmNpc2Ugd29ya3Mgb24gaXRzIG93bi4KCjAwOjAwOjE2LjI1MCAtLT4gMDA6MDA6MjAuODIwClN0YXJ0IHdpdGggS2VlcC4gQXNrOiDigJxXaGF0IGFib3V0IHRoaXMgdGVhbSBzaG91bGQgd2UgcHJvdGVjdD/igJ0KCjAwOjAwOjIwLjg3MCAtLT4gMDA6MDA6MjQuNzQwCkdpdmUgZXZlcnlvbmUgdGhyZWUgbWludXRlcyB0byB3cml0ZSwgdGhlbiBzaGFyZSBpbiBhIHJvdW5kLgoKMDA6MDA6MjQuNzkwIC0tPiAwMDowMDoyNi43NDAKU3RhcnQgd2l0aCBLZWVwIG9uIHB1cnBvc2UuCgowMDowMDoyNi43OTAgLS0+IDAwOjAwOjMxLjMyMApJdCByZW1pbmRzIHBlb3BsZSB3aGF04oCZcyB3b3JraW5nLCBhbmQgaXQgbWFrZXMgdGhlIGhhcmRlciBxdWVzdGlvbnMgZWFzaWVyLgoKMDA6MDA6MzEuMzcwIC0tPiAwMDowMDozNS42NDAKVGhlbiBDaGFuZ2UuIEFzazog4oCcV2hhdCBpcyBubyBsb25nZXIgaGVscGluZyB1cz/igJ0KCjAwOjAwOjM1LjY5MCAtLT4gMDA6MDA6NDAuNjYwCkFnYWluLCB0aHJlZSBtaW51dGVzIG9mIHNpbGVudCB3cml0aW5nLCB0aGVuIGEgcm91bmQuIExpc3RlbiBmb3IgcGF0dGVybnMuCgowMDowMDo0MC43MTAgLS0+IDAwOjAwOjQzLjg0MApJZiBzZXZlcmFsIHBlb3BsZSBuYW1lIHRoZSBzYW1lIHRoaW5nL  too big, nobody followed up, or the real problem sits outside the team. Name it: “This is the third time we’ve written this. What’s really stopping us?” The honest answer to that question is usually more useful than another experiment.","Moment three: big changes nobody chose. A reorganisation, a new leader, people leaving. The team may feel frustrated or sad, and Keep / Change / Try can feel too cheerful. Make room for that first. Ask: “What are we losing, and what do we want to take with us?” Then do the exercise.","One more tip: celebrate experiments that failed. If the team tried something and it didn’t work, that’s learning, not failure. Say so. Teams that are punished for failed experiments stop experimenting.","And if you only remember one thing: the value of this conversation is in the follow-up. An experiment nobody looks at again is just a wish."],"takeaways":["Ask “what part is within our control?” when Change becomes complaining.","Items that keep coming back point to the real problem.","After big change, make room for loss before looking forward."],"try":"Look at the last thing your team said it would try. Did anyone check if it worked?","downloads":["guide"],"visuals":[[1,"control"],[6,"stopping"],[12,"losing"],[17,"kct-try"]],"video":"videos/07-03.mp4","captions":"data:text/vtt;base64,V0VCVlRUCgowMDowMDowMy4xMTAgLS0+IDAwOjAwOjA2LjI4MApUaHJlZSB0cmlja3kgbW9tZW50cyBpbiB0aGUgcmVmb3JtIGNvbnZlcnNhdGlvbi4KCjAwOjAwOjA2LjMzMCAtLT4gMDA6MDA6MTAuMTgwCk1vbWVudCBvbmU6IENoYW5nZSB0dXJucyBpbnRvIGEgY29tcGxhaW50IHNlc3Npb24uCgowMDowMDoxMC4yMzAgLS0+IDAwOjAwOjE0LjQwMApFdmVyeXRoaW5nIGlzIHdyb25nLCBlbmVyZ3kgZHJvcHMsIHBlb3BsZSBzdGFydCBibGFtaW5nIG90aGVycy4KCjAwOjAwOjE0LjQ1MCAtLT4gMDA6MDA6MTguODAwCkJyaW5nIGl0IGJhY2sgZ2VudGx5OiDigJxXaGF0IHBhcnQgb2YgdGhpcyBpcyB3aXRoaW4gb3VyIGNvbnRyb2w/4oCdCgowMDowMDoxOC44NTAgLS0+IDAwOjAwOjIxLjEyMApBbmQgbW92ZSB0byBUcnkgc29vbmVyLgoKMDA6MDA6MjEuMTcwIC0tPiAwMDowMDoyNi45NDAKQ29tcGxhaW50cyBhcmUgb2Z0ZW4gZnJ1c3RyYXRlZCB3aXNoZXM7IFRyeSB0dXJucyB0aGVtIGludG p1c3QgYSB3aXNoLgoK","poster":"videos/07-03-poster.jpg","secs":99.64,"dur":"1:40","glance":["control","stopping","losing"]}]},{"id":"m8","n":8,"title":"Keep it alive","step":0,"intro":"Plan your series, follow through after each session, and know when to bring in help.","lessons":[{"id":"8-1","title":"Planning your series","min":1.574,"script":["You now know how to run all six conversations. The next question is: how do you fit them into real life?","There are two common ways. The first is one workshop day. You go through all six conversations in one day, often away from the office. It builds energy and a strong shared experience. But it’s intense, and the later conversations often get less attention than they deserve.","The second way is a series. One conversation every week or two, in sessions of sixty to ninety minutes. It fits better into a normal calendar, gives people time to reflect between sessions, and lets you test agreements before the next one. For most teams, this is what I recommend.","You can also mix them. For example, start with Why and Who in a half day, and then do the others as shorter sessions.","Whatever you choose, start with the conversation your team needs most. The health check helps you here. For a new team, that’s usually Why and Who. For an existing team, it’s often Decisions or Values.","A typical series could look like this. Week one: Why are we here? Week two or three: Who are we? Then Rhythm, Decisions and Values, each two weeks apart. And Evolve after about three months, to look back at everything.","And plan the next session before you end the current one. Momentum is fragile. If the next date isn’t in the calendar when people leave the room, it often doesn’t happen."],"takeaways":["A series of 60–90 minute sessions fits most teams best.","Start with the conversation your team needs most.","Put the next date in the calendar before people leave the room."],"try":"Draft your series: which conversation first, and which dates. Put the f pens. At your next team meeting, spend two minutes on: “How are we doing with what we agreed?”","Fourth, notice what changes. After a few weeks, ask the team: “What’s different since we had this conversation?” Celebrate the small things. It shows people that these conversations are worth their time.","And remember the thing you wrote down in the very first lesson: what you wanted to be different in three months. Look at it now and then. Is it changing?"],"takeaways":["Share the canvas and agreements within a day.","Use the canvas in normal work. That’s what makes it real.","Check in on agreements for two minutes in regular meetings."],"try":"After your first session, write up the agreements within 24 hours and share them.","downloads":["guide","templates","emails"],"visuals":[[2,"follow-1"],[7,"follow-2"],[12,"follow-3"],[15,"follow-4"]],"video":"videos/08-02.mp4","captions":"data:text/vtt;base64,V0VCVlRUCgowMDowMDowMy4wNzAgLS0+IDAwOjAwOjA2Ljg2MApUaGUgc2Vzc2lvbiBpcyBvdmVyLiBOb3cgdGhlIHJlYWwgd29yayBiZWdpbnMuCgowMDowMDowNi45MTAgLS0+IDAwOjAwOjExLjMyMApIZXJl4oCZcyBob3cgdG8gbWFrZSBzdXJlIHdoYXQgeW91IGFncmVlZCBhY3R1YWxseSBjaGFuZ2VzIGhvdyB5b3Ugd29yay4KCjAwOjAwOjExLjM3MCAtLT4gMDA6MDA6MTMuOTQwCkZpcnN0LCB3cml0ZSBpdCB1cCB3aXRoaW4gYSBkYXkuCgowMDowMDoxMy45OTAgLS0+IDAwOjAwOjE5LjIyMApOb3QgYSBsb25nIHJlcG9ydDoganVzdCB0aGUgY2FudmFzLCBhbmQgYSBzaG9ydCBsaXN0IG9mIGFncmVlbWVudHMgYW5kIG5leHQgc3RlcHMuCgowMDowMDoxOS4yNzAgLS0+IDAwOjAwOjIyLjc2MApTaGFyZSBpdCB3aXRoIGV2ZXJ5b25lLCBhbmQgcHV0IGl0IHNvbWV3aGVyZSBwZW9wbGUgd2lsbCBzZWUgaXQuCgowMDowMDoyMi44MTAgLS0+IDAwOjAwOjI1Ljk0MApBIHByaW50ZWQgY2FudmFzIG9uIHRoZSB3YWxsIHdvcmtzIHN1cnByaXNpbmdseSB3ZWxsLgoKMDA6MDA6MjUuOTkwIC0tPiAwMDowMDoyOC40MjAKT25saW5lLCBwaW4gaXQgaW4geW91ciB0ZWFtIGNoYW5uZWwuCgowMDowMDoyOC40NzAgLS0+IDAwOjAwOjMyLjc0MApTZWNvbmQsIHVzZSBpdC4gUmVmZXIgdG8gdGhlIGNhbnZhcyBpbiBub3JtYWwgd29yay4KCjAwOjAwOjMyLjc5MCAtLT4gMDA6MDA6MzUuNjgwCldoZW4gYSBkZWNpc2lvbiBjb21lcyB1cCwgY2hlY2sgdGhlIGRlY2lzaW9uIHJ1bGVzLgoKMDA6MDA6MzUuNzMwIC0tPiAwMDowMDozOS43MDAKV2hlbi e same time. Someone else should hold the room, so you can be a team member.","The second is when trust is low. After a difficult reorganisation, a conflict, or a period where people left, people may not speak openly with their manager in the room guiding the process. A neutral person helps.","The third is when the stakes are high. A new leadership team, a strategy, a merger of two teams. When the outcome matters a lot, it’s worth having someone whose only job is the process.","And the fourth is simply when you want to take part fully. For many leaders, the most valuable thing about an outside facilitator is that they get to think, instead of running the session.","An outside facilitator doesn’t have to be expensive or external to the company. It can be a colleague from another team, someone from HR, or an internal coach. You could even swap: you facilitate their team, they facilitate yours.","And of course, if you’d like help from me, you can find out more under “Work with Michael” on formyourteam.dk.","Thank you for taking this course. I hope your team gets as much out of these conversations as the teams I’ve worked with. Good luck, and enjoy it."],"takeaways":["Bring in help when the topic is about you, or trust is low.","High stakes deserve someone whose only job is the process.","A colleague from another team can facilitate too. Or swap."],"try":"Find one colleague you could swap facilitation with, and ask them.","downloads":["guide"],"visuals":[[2,"outside"],[14,"swap"],[18,"six"]],"video":"videos/08-03.mp4","captions":"data:text/vtt;base64,V0VCVlRUCgowMDowMDowMy4wNzAgLS0+IDAwOjAwOjA1Ljg0MApZb3UgY2FuIHJ1biBtb3N0IG9mIHRoZXNlIGNvbnZlcnNhdGlvbnMgeW91cnNlbGYuCgowMDowMDowNS44OTAgLS0+IDAwOjAwOjA3LjY2MApUaGF04oCZcyB0aGUgcG9pbnQgb2YgdGhpcyBjb3Vyc2UuCgowMDowMDowNy43MTAgLS0+IDAwOjAwOjEyLjI0MApCdXQgdGhlcmUgYXJlIG1vbWVudHMgd2hlbiBhbiBvdXRzaWRlIGZhY2lsaXRhdG9yIG1ha2VzIGEgcmVhbCBkaWZmZXJlbmNlLgoKMDA6MDA6MTIuMjkwIC0tPiAwMDowMDoxNS4yMDAKVGhlIGZpcnN0IGlzIHdoZW4gdGhlIHRvcGljIGl // Concept visuals for lesson videos: flat brand drawings, one per id. VIS[id](acc) -> SVG string (viewBox 600x640).
(function () {
  const INK = '#191B2E', INK3 = '#6A6E84', LINE = '#D9D3C6', PAPER = '#FFFFFF';
  const C = ['#DE942A', '#E0634D', '#3A86CF', '#7D5ACF', '#279A76', '#6C9724'];

  const F = 'font-family="Schibsted Grotesk, sans-serif" font-weight="700"';
  const svg = (body) => `<svg viewBox="0 0 600 640" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">${body}</svg>`;
  const text = (x, y, s, size = 30, fill = INK, anchor = 'middle', w = 700) => `<text x="${x}" y="${y}" font-family="Schibsted Grotesk, sans-serif" font-weight="${w}" font-size="${size}" fill="${fill}" text-anchor="${anchor}" letter-spacing="-0.01em">${s}</text>`;
  // a person: head with a calm smile, rounded shoulders in a colour
  // a person in the same style as the animated characters: skin, hair, shoulders, a calm smile
  const SKIN = ['#F3D2B8', '#E2AE8A', '#C58B63', '#8E5B3E'], HAIR = ['#3B2A22', '#191B2E', '#6B4428', '#A8642F'];
  const HAIRS = [
    'M-23,-4 q0,-26 23,-26 q23,0 23,26 q-6,-12 -23,-14 q-16,2 -23,14 z',
    'M-24,2 q-2,-31 24,-31 q27,0 24,31 l-4,-11 q-18,-2 -27,-13 q-7,11 -17,13 z',
    'M-25,10 q-6,-40 25,-38 q30,0 25,38 q2,-20 -6,-25 q-20,9 -38,3 q-4,9 -6,22 z',
    'M-22,-6 q2,-23 22,-23 q20,0 22,23 q-9,-9 -22,-9 q-13,0 -22,9 z'];
  let pIdx = 0;
  const person = (x, y, col, s = 1) => { const k = (Math.max(0, C.indexOf(col)) + pIdx++) % 4, sk = SKIN[(k * 3 + 1) % 4];
    return `<g transform="translate(${x} ${y}) scale(${s})">
    <ellipse cx="0" cy="71" rx="36" ry="6" fill="${INK}" opacity=".07"/>
    <path d="M-36 70 Q-37 36 -20 30 Q0 23 20 30 Q37 36 36 70 Z" fill="${col}"/>
    <ellipse cx="0" cy="1" rx="21" ry="23" fill="${sk}"/>
    <path d="${HAIRS[k]}" fill="${HAIR[k]}"/>
    <ellipse cx="-7" cy="3" rx="2.5" ry="2.9" fill="${INK}"/><ellipse cx="7" cy="3" rx="2.5" ry="2.9" fill="${INK}"/>
    <circle cx="-12" cy="10" r="3" fill="#E8826B" opacity=".35"/><circle cx="12" cy="10" r="3" fill="#E8826B" opacity=".35"/>
    <path d="M-5 12 Q0 16 5 12" fill="none" stroke="${INK}" stroke-width="2.4" stroke-linecap="round"/></g>`; };
  const postit = (x, y, col, r = 0, w = 70, label = '') => `<g transform="translate(${x} ${y}) rotate(${r})"><rect x="${-w / 2}" y="${-w / 2}" width="${w}" height="${w}" rx="4" fill="${col}"/><path d="M${-w / 2 + 12} ${-6} h${w - 26} M${-w / 2 + 12} ${8} h${w - 36}" stroke="${INK}" stroke-opacity=".35" stroke-width="3" stroke-linecap="round"/>${label ? text(0, 6, label, 16) : ''}</g>`;
  const bubble = (x, y, word, col) => {
    const w = word.length * 14 + 34;
    return `<g transform="translate(${x} ${y})"><rect x="${-w / 2}" y="-26" width="${w}" height="44" rx="22" fill="${PAPER}" stroke="${INK}" stroke-width="3"/><path d="M-6 18 L0 30 L8 18" fill="${PAPER}" stroke="${INK}" stroke-width="3" stroke-linejoin="round"/><rect x="-7" y="14" width="16" height="6" fill="${PAPER}"/>${text(0, 6, word, 22, col)}</g>`;
  };
  const ring = (n, cx, cy, r) => Array.from({ length: n }, (_, i) => { const a = -Math.PI / 2 + (i / n) * Math.PI * 2; return [cx + Math.cos(a) * r, cy + Math.sin(a) * r]; });
  const arrowHead = (x, y, a, col) => `<path d="M0 0 L-16 -9 L-16 9 Z" transform="translate(${x} ${y}) rotate(${(a * 180) / Math.PI})" fill="${col}"/>`;

  const phases = (hi) => (acc) => {
    const names = ['Open', 'Hold', 'Close'], sub = ['check-in · frame', 'write · rounds · time', 'read back · check-out'];
    const icons = [
      (x, y, c) => `<circle cx="${x}" cy="${y}" r="26" fill="none" stroke="${c}" stroke-width="5"/><circle cx="${x}" cy="${y}" r="7" fill="${c}"/>`,
      (x, y, c) => `<rect x="${x - 26}" y="${y - 20}" width="52" height="40" rx="6" fill="none" stroke="${c}" stroke-width="5"/><path d="M${x - 14} ${y - 4} h28 M${x - 14} ${y + 8} h18" stroke="${c}" stroke-width="5" stroke-linecap="round"/>`,
      (x, y, c) => `<path d="M${x - 22} ${y + 2} l14 14 l30 -32" fill="none" stroke="${c}" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>`,
    ];
    let b = '';
    names.forEach((n, i) => {
      const y = 110 + i * 175, on = hi == null || hi === i, col = on ? acc : LINE;
      b += `<rect x="70" y="${y - 70}" width="460" height="140" rx="28" fill="${on ? PAPER : '#F6F3EC'}" stroke="${on ? INK : LINE}" stroke-width="${hi === i ? 4 : 3}"/>`;
      b += icons[i](150, y, on ? acc : '#B9B4A8');
      b += text(215, y - 6, n, 46, on ? INK : '#A9A498', 'start');
      b += text(215, y + 34, sub[i], 22, on ? INK3 : '#B9B4A8', 'start', 600);
      if (i < 2) b += `<path d="M300 ${y + 72} v30" stroke="${INK}" stroke-width="3" stroke-dasharray="4 7" stroke-linecap="round"/>`;
    });
    return svg(b);
  };

  const circleOf = (words, centre) => (acc) => {
    const pts = ring(6, 300, 320, 185);

    if (centre) b += text(300, 625, centre, 30, acc);
    pts.forEach(([x, y], i) => { b += person(x, y - 20, C[i], 0.95); if (words[i]) b += bubble(x, y - 88, words[i], C[i]); });
    return svg(b);
  };

  const VIS = {
    'phases': phases(null),
    'phases-open': phases(0),
    'phases-hold': phases(1),
    'phases-close': phases(2),
    'checkin': circleOf(['calm', 'curious', 'tired', 'ready', 'busy', 'glad'], 'one word each'),
    'checkout': circleOf(['clarity', 'a plan', 'energy', 'trust', 'a question', 'relief'], 'what do you take with you?'),
    'frame': (acc) => {
      let b = `<rect x="90" y="60" width="420" height="520" rx="22" fill="${PAPER}" stroke="${INK}" stroke-width="3"/>`;
      b += text(130, 130, 'Today', 40, INK, 'start');
      [['Why we’re here', C[0]], ['What we’ll do', C[2]], ['What we’ll have at the end', C[4]]].forEach(([t, c], i) => {

        b += person(x, 270, c, 1.1);
        b += postit(x - 10, 470 + (i % 2) * 20, ['#F7C873', '#9CC7EF', '#93D3B9'][i], (i - 1) * 6, 74);
      });
      b += text(300, 120, '2–3 minutes, in silence', 34, acc);
      b += `<path d="M230 150 q70 -20 140 0" fill="none" stroke="${LINE}" stroke-width="3" stroke-dasharray="4 8"/>`;
      return svg(b);

    'round': (acc) => {
      const pts = ring(6, 300, 340, 190);
      let b = '';
      for (let i = 0; i < 6; i++) {
        const a0 = -Math.PI / 2 + (i / 6) * Math.PI * 2 + 0.28, a1 = a0 + Math.PI * 2 / 6 - 0.56, r = 232;
        const x0 = 300 + Math.cos(a0) * r, y0 = 340 + Math.sin(a0) * r, x1 = 300 + Math.cos(a1) * r, y1 = 340 + Math.sin(a1) * r;
        b += `<path d="M${x0} ${y0} A${r} ${r} 0 0 1 ${x1} ${y1}" fill="none" stroke="${acc}" stroke-width="5" stroke-linecap="round"/>` + arrowHead(x1, y1, a1 + Math.PI / 2, acc);
      }
      pts.forEach(([x, y], i) => { b += person(x, y - 30, C[i], 0.85); b += `<circle cx="${x + 34}" cy="${y - 60}" r="17" fill="${INK}"/>` + text(x + 34, y - 52, String(i + 1), 20, '#fff'); });
      b += text(300, 352, 'everyone,', 28, INK3, 'middle', 600) + text(300, 388, 'one thing', 28, INK3, 'middle', 600);

      ${prev?`<button class="btn btn-ghost" data-go="${prev.id}">‹ Previous</button>`:'<span></span>'}
      <div class="right">
        <button class="btn ${P.done[l.id]?'btn-done':'btn-ghost'}" id="toggle">${P.done[l.id]?'✓ Done':'Mark as done'}</button>
        ${next?`<button class="btn btn-dark" data-go="${next.id}" data-complete="${l.id}">Next lesson ${arrow}</button>`:`<button class="btn btn-dark" data-go="home" data-complete="${l.id}">Finish course ${arrow}</button>`}
      </div>
    </div>`;
  document.getElementById('toggle').onclick=()=>{P.done[l.id]=!P.done[l.id];save();renderLesson(l);renderSide(l);};
}
view.addEventListener('click',e=>{const g=e.target.closest('[data-go]');if(!g)return;if(g.dataset.complete){P.done[g.dataset.complete]=true;save();}go(g.dataset.go);});

function go(id){ if(location.hash!=='#'+id) location.hash=id; else route(); }
function route(){
  const id=decodeURIComponent(location.hash.slice(1));
  const l=ALL.find(x=>x.id===id);
  view.style.removeProperty('--accent'); view.style.removeProperty('--accent-soft'); view.style.removeProperty('--accent-dark');
  if(l){P.last=l.id;P.open[l.mod.id]=true;save();renderLesson(l);}else renderHome();
  renderSide(l||null); window.scrollTo(0,0); view.focus({preventScroll:true});
  document.title=(l?l.title+' · ':'')+'Facilitation Course · Form Your Team';
}
const menu=document.getElementById('menu');
function closeMenu(){side.classList.remove('open');menu.setAttribute('aria-expanded','false')}
menu.onclick=()=>{const o=!side.classList.contains('open');side.classList.toggle('open',o);menu.setAttribute('aria-expanded',o)};
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeMenu()});
// enlarge the "At a glance" drawings
const lb=document.createElement('div');lb.className='lb';lb.setAttribute('role','dialog');lb.setAttribute('aria-modal','true');lb.setAttribute('aria-label','Drawing');
lb.innerHTML='<figure></figure><button class="x" aria-label="Close">×</button><button class="pv" aria-label="Previous">‹</button><button class="nx" aria-label="Next">›</button><span class="ct"></span>';
document.body.appendChild(lb);
let lbList=[],lbI=0,lbFrom=null;
const lbShow=i=>{lbI=(i+lbList.length)%lbList.length;const c=lbList[lbI],f=lb.querySelector('figure');f.innerHTML=c.innerHTML;f.style.background=c.style.background;const many=lbList.length>1;lb.querySelector('.pv').style.display=lb.querySelector('.nx').style.display=many?'':'none';lb.querySelector('.ct').textContent=many?`${lbI+1} / ${lbList.length}`:'';};
const lbOpen=c=>{lbFrom=c;lbList=[...c.parentNode.querySelectorAll('.glance-card')];lbShow(lbList.indexOf(c));lb.classList.add('on');document.body.style.overflow='hidden';lb.querySelector('.x').focus();};
const lbClose=()=>{lb.classList.remove('on');document.body.style.overflow='';if(lbFrom)lbFrom.focus();};
document.addEventListener('click',e=>{const c=e.target.closest('.glance-card');if(c)return lbOpen(c);if(!lb.classList.contains('on'))return;if(e.target.closest('.pv'))return lbShow(lbI-1);if(e.target.closest('.nx'))return lbShow(lbI+1);if(!e.target.closest('figure'))lbClose();});
document.addEventListener('keydown',e=>{const c=e.target.closest&&e.target.closest('.glance-card');if(c&&(e.key==='Enter'||e.key===' ')){e.preventDefault();return lbOpen(c);}if(!lb.classList.contains('on'))return;if(e.key==='Escape')lbClose();else if(e.key==='ArrowLeft')lbShow(lbI-1);else if(e.key==='ArrowRight')lbShow(lbI+1);});
document.addEventListener('click',e=>{if(side.classList.contains('open')&&!side.contains(e.target)&&!menu.contains(e.target))closeMenu()});
window.addEventListener('hashchange',route);
route();
})();
</script>
<style>.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}</style>
</body>
</html>
