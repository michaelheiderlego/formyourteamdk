<style>
/* Layout: workshop wall. A quiet cool-paper workspace; each of the six
   conversations owns one sticky-note hue that follows it everywhere:
   nav badge, section header, exercise steps and its block on the canvas. */
:root {
  --bg: #F3F4F7;
  --surface: #FFFFFF;
  --surface-2: #F8F9FB;
  --sunk: #EBEDF2;
  --ink: #181B32;
  --ink-2: #454A65;
  --ink-3: #6E738C;
  --line: #E0E3EB;
  --line-2: #C9CEDA;
  --focus: #3B54DE;
  --primary: #181B32;
  --primary-ink: #FFFFFF;
  --primary-hover: #2C3050;
  --danger: #C0392B;
  --danger-ink: #FFFFFF;
  --good: #1F8A63;
  --shadow-1: 0 1px 2px rgba(24, 27, 50, .06), 0 1px 1px rgba(24, 27, 50, .04);
  --shadow-2: 0 10px 30px -12px rgba(24, 27, 50, .28), 0 2px 6px rgba(24, 27, 50, .06);
  --shadow-3: 0 24px 60px -20px rgba(24, 27, 50, .45);
  --backdrop: rgba(17, 19, 34, .38);

  --c1: #DE942A; --c1-soft: #FBEFD9; --c1-ink: #84540A;
  --c2: #E0634D; --c2-soft: #FCE6E1; --c2-ink: #9E3725;
  --c3: #3A86CF; --c3-soft: #E1EEFA; --c3-ink: #1D5891;
  --c4: #7D5ACF; --c4-soft: #EEE7FB; --c4-ink: #513296;
  --c5: #279A76; --c5-soft: #DDF2EA; --c5-ink: #16694F;
  --c6: #6C9724; --c6-soft: #EAF2DB; --c6-ink: #476811;

  --font-display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --font-body: "Figtree", "Segoe UI", system-ui, -apple-system, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;

  --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
  --ease-in-out: cubic-bezier(0.77, 0, 0.175, 1);
  --ease-drawer: cubic-bezier(0.32, 0.72, 0, 1);

  --r-sm: 8px;
  --r-md: 12px;
  --r-lg: 18px;
  --gutter-l: max(16px, env(safe-area-inset-left, 0px));
  --gutter-r: max(16px, env(safe-area-inset-right, 0px));

  --step: var(--ink);
  --step-soft: var(--sunk);
  --step-ink: var(--ink);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #10121B; --surface: #171A27; --surface-2: #1C1F2E; --sunk: #0C0E15;
    --ink: #ECEEF6; --ink-2: #B6BACC; --ink-3: #868BA3; --line: #282C40; --line-2: #383D55;
    --focus: #8E9DFF; --primary: #ECEEF6; --primary-ink: #12141F; --primary-hover: #FFFFFF;
    --danger: #EE7A6B; --danger-ink: #1A0F0D; --good: #4CC89A;
    --shadow-1: 0 1px 2px rgba(0, 0, 0, .4);
    --shadow-2: 0 12px 30px -12px rgba(0, 0, 0, .7), 0 2px 6px rgba(0, 0, 0, .3);
    --shadow-3: 0 24px 60px -20px rgba(0, 0, 0, .8);
    --backdrop: rgba(4, 5, 10, .62);
    --c1: #F0B04E; --c1-soft: #33281A; --c1-ink: #F5C878;
    --c2: #F07B66; --c2-soft: #3A221E; --c2-ink: #F6A595;
    --c3: #5EA3E6; --c3-soft: #172A3E; --c3-ink: #94C3F0;
    --c4: #9C7FE7; --c4-soft: #261E3C; --c4-ink: #C3B0F3;
    --c5: #40B892; --c5-soft: #132F28; --c5-ink: #84D8BD;
    --c6: #8EBA41; --c6-soft: #202C12; --c6-ink: #B5D87B;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #10121B; --surface: #171A27; --surface-2: #1C1F2E; --sunk: #0C0E15;
  --ink: #ECEEF6; --ink-2: #B6BACC; --ink-3: #868BA3; --line: #282C40; --line-2: #383D55;
  --focus: #8E9DFF; --primary: #ECEEF6; --primary-ink: #12141F; --primary-hover: #FFFFFF;
  --danger: #EE7A6B; --danger-ink: #1A0F0D; --good: #4CC89A;
  --shadow-1: 0 1px 2px rgba(0, 0, 0, .4);
  --shadow-2: 0 12px 30px -12px rgba(0, 0, 0, .7), 0 2px 6px rgba(0, 0, 0, .3);
  --shadow-3: 0 24px 60px -20px rgba(0, 0, 0, .8);
  --backdrop: rgba(4, 5, 10, .62);
  --c1: #F0B04E; --c1-soft: #33281A; --c1-ink: #F5C878;
  --c2: #F07B66; --c2-soft: #3A221E; --c2-ink: #F6A595;
  --c3: #5EA3E6; --c3-soft: #172A3E; --c3-ink: #94C3F0;
  --c4: #9C7FE7; --c4-soft: #261E3C; --c4-ink: #C3B0F3;
  --c5: #40B892; --c5-soft: #132F28; --c5-ink: #84D8BD;
  --c6: #8EBA41; --c6-soft: #202C12; --c6-ink: #B5D87B;
  color-scheme: dark;
}

[data-step="1"] { --step: var(--c1); --step-soft: var(--c1-soft); --step-ink: var(--c1-ink); }
[data-step="2"] { --step: var(--c2); --step-soft: var(--c2-soft); --step-ink: var(--c2-ink); }
[data-step="3"] { --step: var(--c3); --step-soft: var(--c3-soft); --step-ink: var(--c3-ink); }
[data-step="4"] { --step: var(--c4); --step-soft: var(--c4-soft); --step-ink: var(--c4-ink); }
[data-step="5"] { --step: var(--c5); --step-soft: var(--c5-soft); --step-ink: var(--c5-ink); }
[data-step="6"] { --step: var(--c6); --step-soft: var(--c6-soft); --step-ink: var(--c6-ink); }

/* ---------- base ---------- */
html {
  -webkit-tap-highlight-color: transparent;
  -webkit-text-size-adjust: 100%;
}
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  text-rendering: optimizeLegibility;
}
body::before {
  content: "";
  position: fixed;
  inset: 0 0 auto;
  height: env(safe-area-inset-top, 0px);
  z-index: 40;
  background: var(--bg);
}
*, *::before, *::after { box-sizing: border-box; }
h1, h2, h3, h4 { margin: 0; text-wrap: balance; }
p { margin: 0; }
ul, ol { margin: 0; padding: 0; list-style: none; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
input, textarea, select { font: inherit; color: inherit; }
code { font-family: var(--font-mono); font-size: .88em; background: var(--sunk); padding: 1px 5px; border-radius: 5px; }
kbd { font-family: var(--font-mono); font-size: 11px; border: 1px solid var(--line-2); border-radius: 4px; padding: 0 4px; color: var(--ink-3); }
.tnum { font-variant-numeric: tabular-nums; }
.sr-only {
  position: absolute !important; width: 1px; height: 1px; padding: 0; margin: -1px;
  overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
}
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: 6px; }
::selection { background: color-mix(in srgb, var(--focus) 24%, transparent); }

.label-caps {
  font-family: var(--font-mono);
  font-size: 11.5px;
  font-weight: 500;
  letter-spacing: .08em;
  text-transform: uppercase;
  color: var(--ink-3);
}
.icon { flex: none; display: block; }
.link {
  color: var(--ink);
  text-decoration: underline;
  text-decoration-color: var(--line-2);
  text-underline-offset: 3px;
  text-decoration-thickness: 1.5px;
  transition: text-decoration-color 150ms ease;
  text-align: left;
}
@media (hover: hover) and (pointer: fine) {
  .link:hover { text-decoration-color: currentColor; }
}
.link-draft { display: inline-flex; align-items: center; gap: 6px; font-size: 14px; color: var(--ink-2); margin-top: -6px; justify-self: start; }

/* ---------- buttons ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 40px; padding: 0 16px;
  border-radius: 999px;
  font-weight: 600; font-size: 15px; line-height: 1;
  white-space: nowrap;
  touch-action: manipulation; user-select: none; -webkit-user-select: none;
  transition: transform 160ms var(--ease-out), background-color 150ms ease, border-color 150ms ease, color 150ms ease, opacity 150ms ease;
}
.btn:active:not(:disabled) { transform: scale(0.97); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn-primary { background: var(--primary); color: var(--primary-ink); }
.btn-secondary { background: var(--surface); color: var(--ink); box-shadow: inset 0 0 0 1px var(--line-2); }
.btn-danger { background: var(--danger); color: var(--danger-ink); }
.btn-ghost { color: var(--ink-2); }
.btn-sm { min-height: 34px; padding: 0 12px; font-size: 14px; gap: 6px; }
.btn-lg { min-height: 50px; padding: 0 24px; font-size: 16.5px; }
@media (hover: hover) and (pointer: fine) {
  .btn-primary:hover:not(:disabled) { background: var(--primary-hover); }
  .btn-secondary:hover:not(:disabled) { box-shadow: inset 0 0 0 1px var(--ink-3); }
  .btn-ghost:hover { color: var(--ink); }
}
.icon-btn {
  display: inline-grid; place-items: center;
  width: 34px; height: 34px; flex: none;
  border-radius: 999px; color: var(--ink-3);
  touch-action: manipulation; user-select: none; -webkit-user-select: none;
  transition: transform 160ms var(--ease-out), background-color 150ms ease, color 150ms ease;
}
.icon-btn:active { transform: scale(0.94); }
@media (hover: hover) and (pointer: fine) {
  .icon-btn:hover { background: var(--sunk); color: var(--ink); }
}

/* ---------- form fields ---------- */
.field { display: grid; gap: 6px; min-width: 0; align-content: start; }
.field-label { font-weight: 600; font-size: 15px; color: var(--ink); }
.field-lead > .field-label { font-family: var(--font-display); font-size: 21px; font-weight: 600; letter-spacing: -.01em; }
.field-hint { font-size: 14px; color: var(--ink-3); line-height: 1.45; }
.input, .ta {
  width: 100%;
  font-size: 16px;
  line-height: 1.5;
  background: var(--surface);
  border: 1px solid var(--line-2);
  border-radius: var(--r-sm);
  padding: 9px 12px;
  transition: border-color 150ms ease, box-shadow 150ms ease;
}
.ta { resize: none; display: block; overflow: hidden; white-space: pre-wrap; }
.input::placeholder, .ta::placeholder { color: var(--ink-3); opacity: .75; }
.input:focus, .ta:focus { outline: none; border-color: var(--focus); box-shadow: 0 0 0 3px color-mix(in srgb, var(--focus) 18%, transparent); }
.input-sm { padding: 6px 10px; font-size: 16px; }
.select {
  appearance: none; -webkit-appearance: none;
  padding-right: 34px;
  background-image: linear-gradient(45deg, transparent 50%, var(--ink-3) 50%), linear-gradient(135deg, var(--ink-3) 50%, transparent 50%);
  background-position: calc(100% - 17px) 55%, calc(100% - 12px) 55%;
  background-size: 5px 5px, 5px 5px;
  background-repeat: no-repeat;
}
.select-sm { padding-top: 6px; padding-bottom: 6px; }
.input-date { width: auto; min-width: 0; font-variant-numeric: tabular-nums; }
.field-pair { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 20px; }
.field-trio { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; }
.error { color: var(--danger); font-size: 14px; }

.starters { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.starters-label { font-size: 13px; color: var(--ink-3); margin-right: 2px; }
.starter {
  font-size: 13.5px; padding: 4px 10px; border-radius: 999px;
  background: var(--step-soft); color: var(--step-ink);
  touch-action: manipulation;
  transition: transform 160ms var(--ease-out), filter 150ms ease;
}
.starter:active { transform: scale(0.96); }
@media (hover: hover) and (pointer: fine) { .starter:hover { filter: saturate(1.4); } }

.chip-btn {
  font-size: 14px; padding: 6px 12px; border-radius: 999px;
  box-shadow: inset 0 0 0 1px var(--line-2); color: var(--ink-2);
  touch-action: manipulation;
  transition: transform 160ms var(--ease-out), background-color 150ms ease, color 150ms ease;
}
.chip-btn:active { transform: scale(0.96); }
.chip-btn.is-on { background: var(--primary); color: var(--primary-ink); box-shadow: none; }
.date-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.date-readout { font-size: 14px; color: var(--ink-2); font-variant-numeric: tabular-nums; }

.segmented {
  display: inline-flex; flex-wrap: wrap; gap: 2px; padding: 3px;
  background: var(--sunk); border-radius: 999px; max-width: 100%;
}
.seg {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 7px 14px; border-radius: 999px; font-size: 14px; font-weight: 500; color: var(--ink-2);
  touch-action: manipulation; user-select: none; -webkit-user-select: none;
  transition: background-color 150ms ease, color 150ms ease, box-shadow 150ms ease;
}
.seg.is-on { background: var(--surface); color: var(--ink); box-shadow: var(--shadow-1); }
.segmented-sm .seg { padding: 5px 11px; font-size: 13.5px; }
.status-seg .seg.is-on.tone-keep { background: var(--c5-soft); color: var(--c5-ink); }
.status-seg .seg.is-on.tone-change { background: var(--c1-soft); color: var(--c1-ink); }
.status-seg .seg.is-on.tone-combine { background: var(--c3-soft); color: var(--c3-ink); }
.status-seg .seg.is-on.tone-remove { background: var(--c2-soft); color: var(--c2-ink); }

/* ---------- avatars ---------- */
.avatar {
  --h: var(--c3); --hs: var(--c3-soft); --hi: var(--c3-ink);
  display: inline-grid; place-items: center; flex: none;
  width: 32px; height: 32px; border-radius: 50%;
  font-family: var(--font-mono); font-size: 12px; font-weight: 500; letter-spacing: .02em;
  background: var(--hs);
  color: var(--hi);
  box-shadow: inset 0 0 0 1px var(--h);
}
.avatar[data-hue="0"] { --h: var(--c3); --hs: var(--c3-soft); --hi: var(--c3-ink); }
.avatar[data-hue="1"] { --h: var(--c2); --hs: var(--c2-soft); --hi: var(--c2-ink); }
.avatar[data-hue="2"] { --h: var(--c5); --hs: var(--c5-soft); --hi: var(--c5-ink); }
.avatar[data-hue="3"] { --h: var(--c1); --hs: var(--c1-soft); --hi: var(--c1-ink); }
.avatar[data-hue="4"] { --h: var(--c4); --hs: var(--c4-soft); --hi: var(--c4-ink); }
.avatar[data-hue="5"] { --h: var(--c6); --hs: var(--c6-soft); --hi: var(--c6-ink); }
.avatar-sm { width: 26px; height: 26px; font-size: 10.5px; }
.avatar-xs { width: 22px; height: 22px; font-size: 9.5px; }

/* ---------- status ---------- */
.status {
  display: inline-flex; align-items: center; gap: 6px;
  font-size: 12.5px; font-weight: 600; padding: 3px 10px 3px 8px; border-radius: 999px;
  background: var(--sunk); color: var(--ink-2); white-space: nowrap;
}
.status-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--ink-3); }
.status-empty .status-dot { background: transparent; box-shadow: inset 0 0 0 1.5px var(--ink-3); }
.status-draft { background: var(--c1-soft); color: var(--c1-ink); }
.status-draft .status-dot { background: var(--c1); }
.status-complete { background: var(--c5-soft); color: var(--c5-ink); }
.status-complete .status-dot { background: var(--c5); }

.save-state { display: inline-flex; align-items: center; gap: 7px; font-size: 13px; color: var(--ink-3); white-space: nowrap; font-variant-numeric: tabular-nums; }
.save-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--good); transition: background-color 200ms ease, opacity 200ms ease; }
.save-state.is-saving .save-dot { background: var(--ink-3); animation: save-pulse 900ms ease-in-out infinite; }
.save-state.is-off .save-dot { background: var(--danger); }
@keyframes save-pulse { 50% { opacity: .3; } }

/* ---------- app shell ---------- */
.app { min-height: 100%; }
.app.is-working { display: grid; grid-template-columns: 1fr; }
.workspace { min-width: 0; padding-left: var(--gutter-l); padding-right: var(--gutter-r); padding-block: 0 64px; }
.view-step .workspace, .view-setup .workspace, .view-hub .workspace, .view-about .workspace { display: grid; grid-template-columns: minmax(0, 1fr); justify-items: center; }
.view-step .view-enter, .view-setup .view-enter { width: 100%; max-width: 860px; }
.view-hub .view-enter, .view-about .view-enter { width: 100%; max-width: 1180px; }
.view-canvas .view-enter { width: 100%; max-width: 1320px; margin-inline: auto; }
.view-enter { animation: view-in 260ms var(--ease-out) both; }
@keyframes view-in { from { opacity: 0; transform: translateY(6px); } }

.sidebar { display: none; }
.mobile-top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30;
  background: color-mix(in srgb, var(--bg) 92%, transparent);
  backdrop-filter: saturate(1.4) blur(10px); -webkit-backdrop-filter: saturate(1.4) blur(10px);
  border-bottom: 1px solid var(--line);
  padding-left: var(--gutter-l); padding-right: var(--gutter-r);
  padding-block: 6px 10px;
}
.mobile-bar { display: flex; align-items: center; gap: 8px; }
.mobile-bar .icon-btn { margin-left: -8px; color: var(--ink); }
.mobile-title { display: grid; min-width: 0; flex: 1; line-height: 1.25; }
.mobile-team { font-weight: 600; font-size: 15px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mobile-step { font-size: 12.5px; color: var(--ink-3); font-family: var(--font-mono); }
.progress-segs { display: grid; grid-template-columns: repeat(6, 1fr); gap: 4px; margin-top: 8px; }
.seg-bar {
  display: block; width: 100%; height: 14px; position: relative; touch-action: manipulation;
}
.seg-bar::before {
  content: ""; position: absolute; left: 0; right: 0; top: 5px; height: 4px; border-radius: 4px;
  background: var(--line-2); transition: background-color 200ms ease;
}
.seg-bar.is-draft::before { background: color-mix(in srgb, var(--step) 45%, var(--line)); }
.seg-bar.is-complete::before { background: var(--step); }
.seg-bar.is-current::before { top: 4px; height: 6px; box-shadow: 0 0 0 2px var(--bg), 0 0 0 3.5px var(--step); }

.mobile-actions {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
  display: flex; gap: 8px; align-items: center;
  padding-left: var(--gutter-l); padding-right: var(--gutter-r);
  padding-top: 10px; padding-bottom: calc(10px + env(safe-area-inset-bottom, 0px));
  background: color-mix(in srgb, var(--surface) 94%, transparent);
  backdrop-filter: saturate(1.4) blur(10px); -webkit-backdrop-filter: saturate(1.4) blur(10px);
  border-top: 1px solid var(--line);
}
.mobile-actions .btn-primary { flex: 1; }
.mobile-save { box-shadow: inset 0 0 0 1px var(--line-2); width: 40px; height: 40px; color: var(--ink); }
.view-step .workspace { padding-bottom: calc(96px + env(safe-area-inset-bottom, 0px)); }

@media (min-width: 960px) {
  .app.is-working { grid-template-columns: 296px minmax(0, 1fr); }
  .mobile-top, .mobile-actions { display: none; }
  .view-step .workspace { padding-bottom: 80px; }
  .workspace { padding-left: max(40px, env(safe-area-inset-left, 0px)); padding-right: max(40px, env(safe-area-inset-right, 0px)); }
  .sidebar {
    display: flex; flex-direction: column; gap: 20px;
    position: sticky; top: 0; height: 100vh; height: 100dvh; overflow-y: auto;
    padding: 20px 16px 16px; padding-left: max(16px, env(safe-area-inset-left, 0px));
    border-right: 1px solid var(--line);
    background: var(--surface-2);
  }
}

.wordmark { display: inline-flex; align-items: center; gap: 10px; font-family: var(--font-display); font-weight: 700; font-size: 15px; letter-spacing: -.01em; }
.wordmark-btn { padding: 4px 6px; margin: -4px -6px; border-radius: 8px; }
.wm-mark { display: grid; grid-template-columns: repeat(3, 7px); gap: 2px; }
.wm-mark i { width: 7px; height: 7px; border-radius: 2px; background: var(--step); }
.sidebar-top { display: grid; gap: 16px; }
.team-card {
  display: grid; gap: 2px; text-align: left; width: 100%;
  padding: 12px 14px; border-radius: var(--r-md);
  background: var(--surface); box-shadow: inset 0 0 0 1px var(--line);
  transition: box-shadow 150ms ease;
}
.team-card.is-current { box-shadow: inset 0 0 0 1.5px var(--ink); }
@media (hover: hover) and (pointer: fine) { .team-card:hover { box-shadow: inset 0 0 0 1px var(--line-2); } }
.team-name { font-family: var(--font-display); font-weight: 650; font-size: 18px; line-height: 1.2; overflow-wrap: anywhere; letter-spacing: -.01em; }
.team-sub { font-size: 13px; color: var(--ink-3); }
.sidebar-foot { margin-top: auto; display: grid; gap: 10px; justify-items: start; padding-top: 12px; border-top: 1px solid var(--line); }

.stepnav ol { display: grid; gap: 2px; }
.stepnav-item, .stepnav-canvas {
  display: flex; align-items: center; gap: 12px; width: 100%; text-align: left;
  padding: 9px 10px; border-radius: 10px;
  transition: background-color 150ms ease;
}
.stepnav-item.is-current, .stepnav-canvas.is-current { background: var(--step-soft); }
.stepnav-canvas.is-current { background: var(--sunk); }
@media (hover: hover) and (pointer: fine) {
  .stepnav-item:not(.is-current):hover, .stepnav-canvas:not(.is-current):hover { background: var(--sunk); }
}
.step-badge {
  display: inline-grid; place-items: center; flex: none;
  width: 28px; height: 28px; border-radius: 50%;
  font-family: var(--font-mono); font-size: 12.5px; font-weight: 500;
  background: var(--surface); color: var(--step-ink);
  box-shadow: inset 0 0 0 1.5px var(--step);
}
.stepnav-item.is-complete .step-badge, .section-eyebrow .step-badge { background: var(--step); color: var(--surface); box-shadow: none; }
.stepnav-item.is-draft .step-badge { background: var(--step-soft); }
.step-badge-sm { width: 22px; height: 22px; font-size: 11px; }
.stepnav-text { display: grid; min-width: 0; line-height: 1.3; }
.stepnav-title { font-size: 14.5px; font-weight: 600; }
.stepnav-status { font-size: 12.5px; color: var(--ink-3); }
.stepnav-canvas { margin-top: 10px; padding-top: 12px; border-top: 1px solid var(--line); border-radius: 0 0 10px 10px; }
.stepnav-canvas.is-current { border-radius: 10px; }
.canvas-glyph { display: grid; grid-template-columns: 1fr 1fr; gap: 2px; width: 28px; height: 28px; padding: 5px; flex: none; border-radius: 7px; box-shadow: inset 0 0 0 1.5px var(--ink-2); }
.canvas-glyph i { border-radius: 2px; background: var(--ink-2); opacity: .55; }
.canvas-glyph i:first-child { grid-column: span 2; opacity: .9; }

/* ---------- drawer (mobile nav) ---------- */
.drawer-root { position: fixed; inset: 0; z-index: 60; }
.drawer-backdrop { position: absolute; inset: 0; background: var(--backdrop); opacity: 0; transition: opacity 200ms ease; }
.drawer {
  position: absolute; top: 0; bottom: 0; left: 0; width: min(340px, 88vw);
  background: var(--surface-2); box-shadow: var(--shadow-3);
  padding: 8px 14px 16px; padding-top: calc(8px + env(safe-area-inset-top, 0px)); padding-left: max(14px, env(safe-area-inset-left, 0px));
  padding-bottom: calc(16px + env(safe-area-inset-bottom, 0px));
  overflow-y: auto; overscroll-behavior: contain;
  display: flex; flex-direction: column; gap: 14px;
  transform: translateX(-100%);
  transition: transform 280ms var(--ease-drawer);
}
.drawer-root.is-shown .drawer-backdrop { opacity: 1; }
.drawer-root.is-shown .drawer { transform: translateX(0); }
.drawer-head { display: flex; justify-content: flex-end; margin-bottom: -6px; }
.drawer-foot { display: flex; gap: 8px; flex-wrap: wrap; margin-top: auto; padding-top: 12px; border-top: 1px solid var(--line); }

/* ---------- landing ---------- */
.landing { max-width: 1080px; margin: 0 auto; padding-block: 18px 40px; display: grid; gap: 56px; }
.landing-bar { display: flex; align-items: center; justify-content: space-between; }
.hero { display: grid; gap: 22px; padding-top: clamp(24px, 6vw, 72px); max-width: 860px; }
.eyebrow-line { font-family: var(--font-mono); font-size: 13px; letter-spacing: .04em; color: var(--ink-3); }
.hero-title {
  font-family: var(--font-display);
  font-size: clamp(42px, 8.4vw, 96px);
  line-height: .95;
  font-weight: 700;
  letter-spacing: -.035em;
  font-variation-settings: "opsz" 96;
}
.hero-title .re {
  font-weight: 400; color: var(--ink-3);
  letter-spacing: -.02em;
}
.hero-lead { font-size: clamp(18px, 2.2vw, 21px); line-height: 1.5; color: var(--ink-2); max-width: 36em; }
.hero-actions { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; }
.hero-minor { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; color: var(--ink-3); font-size: 15px; width: 100%; margin-top: 4px; }

.journey { display: grid; gap: 14px; }
.journey-list { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 10px; }
.journey-step {
  display: grid; align-content: start; gap: 4px;
  padding: 14px 14px 18px; border-radius: var(--r-md);
  background: var(--step-soft); color: var(--step-ink);
  min-height: 132px;
  animation: note-in 420ms var(--ease-out) both;
}
.journey-step:nth-child(1) { rotate: -1.2deg; animation-delay: 40ms; }
.journey-step:nth-child(2) { rotate: .8deg; animation-delay: 90ms; }
.journey-step:nth-child(3) { rotate: -.4deg; animation-delay: 140ms; }
.journey-step:nth-child(4) { rotate: 1.1deg; animation-delay: 190ms; }
.journey-step:nth-child(5) { rotate: -.9deg; animation-delay: 240ms; }
.journey-step:nth-child(6) { rotate: .5deg; animation-delay: 290ms; }
@keyframes note-in { from { opacity: 0; transform: translateY(10px); } }
.journey-n { font-family: var(--font-mono); font-size: 12px; opacity: .8; }
.journey-short { font-family: var(--font-display); font-weight: 700; font-size: 22px; letter-spacing: -.02em; line-height: 1.1; }
.journey-q { font-size: 14.5px; line-height: 1.35; color: var(--ink-2); }
.journey-loop { display: flex; align-items: center; gap: 8px; color: var(--ink-2); font-size: 15px; }
.facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 28px 32px; padding-top: 28px; border-top: 1px solid var(--line); }
.facts h3 { font-family: var(--font-display); font-size: 18px; font-weight: 650; margin-bottom: 6px; letter-spacing: -.01em; }
.facts p { color: var(--ink-2); font-size: 15.5px; }
.landing-foot { display: flex; align-items: center; gap: 8px; color: var(--ink-3); font-size: 14px; }
@media (max-width: 860px) {
  .journey-list { grid-template-columns: repeat(3, minmax(0, 1fr)); }
}
@media (max-width: 520px) {
  .journey-list { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .journey-step { min-height: 112px; }
  .hero-actions .btn { width: 100%; }
}

/* ---------- section ---------- */
.section, .setup { display: grid; gap: 36px; padding-top: 28px; }
@media (min-width: 960px) { .section, .setup { padding-top: 48px; } }
.section-head, .setup-head { display: grid; gap: 12px; }
.section-eyebrow { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
.section-eyebrow .label-caps { color: var(--step-ink); }
.section-title { font-family: var(--font-display); font-weight: 700; font-size: clamp(34px, 5vw, 52px); line-height: 1.02; letter-spacing: -.03em; font-variation-settings: "opsz" 72; }
.framing { font-family: var(--font-display); font-size: clamp(19px, 2.4vw, 23px); line-height: 1.35; color: var(--step-ink); font-weight: 500; letter-spacing: -.01em; }
.section-intro { color: var(--ink-2); max-width: 38em; font-size: 16.5px; }

.questions { display: grid; gap: 10px; }
.questions ul { display: grid; border-top: 1px solid var(--line); }
.questions li {
  padding: 12px 0 12px 26px; border-bottom: 1px solid var(--line); position: relative;
  font-size: 18px; font-weight: 500; line-height: 1.4;
}
.questions li::before {
  content: ""; position: absolute; left: 4px; top: 21px; width: 10px; height: 10px; border-radius: 3px; background: var(--step); rotate: 45deg;
}
.section-body { display: grid; gap: 28px; }

.exercise {
  background: var(--surface); border-radius: var(--r-lg);
  box-shadow: var(--shadow-1), inset 0 0 0 1px var(--line);
  padding: 22px; display: grid; gap: 14px;
}
@media (min-width: 640px) { .exercise { padding: 28px 30px; } }
.exercise-head { display: flex; flex-wrap: wrap; align-items: flex-start; justify-content: space-between; gap: 8px 16px; }
.exercise-titles { display: grid; gap: 2px; }
.eyebrow { font-family: var(--font-mono); font-size: 11.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--step-ink); }
.exercise-title { font-family: var(--font-display); font-size: 25px; font-weight: 650; letter-spacing: -.02em; line-height: 1.15; }
.format-pill { font-size: 13px; padding: 4px 10px; border-radius: 999px; background: var(--sunk); color: var(--ink-2); white-space: nowrap; }
.exercise-toggle {
  display: inline-flex; align-items: center; gap: 6px; justify-self: start;
  font-size: 14px; font-weight: 600; color: var(--ink-2);
  padding: 6px 10px 6px 6px; margin-left: -6px; border-radius: 8px;
  touch-action: manipulation; user-select: none; -webkit-user-select: none;
}
.toggle-chev { transition: transform 200ms var(--ease-out); }
.exercise-toggle[aria-expanded="false"] .toggle-chev { transform: rotate(-90deg); }
@media (hover: hover) and (pointer: fine) { .exercise-toggle:hover { color: var(--ink); background: var(--sunk); } }
.collapse { display: grid; grid-template-rows: 0fr; opacity: 0; transition: grid-template-rows 240ms var(--ease-out), opacity 180ms ease; }
.collapse.is-open { grid-template-rows: 1fr; opacity: 1; }
.collapse-inner { overflow: hidden; min-height: 0; }
.instructions { display: grid; gap: 14px; padding: 16px 18px; border-radius: var(--r-md); background: var(--step-soft); margin-bottom: 4px; }
.purpose { color: var(--ink); font-size: 15.5px; }
.purpose strong { color: var(--step-ink); }
.steps { display: grid; gap: 10px; counter-reset: s; }
.steps li { display: grid; grid-template-columns: 26px 1fr; gap: 10px; align-items: start; font-size: 15.5px; line-height: 1.5; }
.step-n { display: grid; place-items: center; width: 24px; height: 24px; border-radius: 50%; background: var(--surface); color: var(--step-ink); font-family: var(--font-mono); font-size: 12px; font-weight: 500; margin-top: 1px; }
.instr-note { font-size: 14px; color: var(--ink-2); font-style: italic; }
.capture { display: grid; gap: 22px; padding-top: 6px; }

.canvas-output {
  display: grid; gap: 18px; padding: 22px; border-radius: var(--r-lg);
  background: var(--surface);
  box-shadow: inset 0 0 0 1.5px var(--step);
}
@media (min-width: 640px) { .canvas-output { padding: 28px 30px; } }
.canvas-output header { display: grid; gap: 4px; }
.canvas-output header .label-caps { color: var(--step-ink); }
.canvas-output header p { color: var(--ink-2); font-size: 15px; }
.canvas-output-fields { display: grid; gap: 20px; }
.exercise .canvas-output { box-shadow: inset 0 0 0 1.5px var(--step); }

.checklist { display: grid; gap: 12px; padding: 20px 22px; border-radius: var(--r-lg); background: var(--sunk); }
.checklist header { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.check-count { font-family: var(--font-mono); font-size: 12.5px; color: var(--ink-3); font-variant-numeric: tabular-nums; }
.checklist ul { display: grid; gap: 6px; }
.checklist li { display: flex; align-items: center; gap: 10px; font-size: 15px; }
.checklist li.is-done { color: var(--ink-2); }
.check-mark { width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center; flex: none; box-shadow: inset 0 0 0 1.5px var(--line-2); background: var(--surface); }
.is-done .check-mark { background: var(--step); color: var(--surface); box-shadow: none; }

.step-footer { display: none; }
@media (min-width: 960px) {
  .step-footer { display: flex; gap: 10px; align-items: center; padding-top: 8px; }
  .step-next { margin-left: auto; }
}
.hide-sm { display: inline; }

/* ---------- lists & drag ---------- */
.list-editor { display: grid; gap: 6px; }
.sortable { position: relative; }
.list-items { display: grid; gap: 6px; }
.list-item { display: grid; grid-template-columns: 28px minmax(0, 1fr) 34px; gap: 4px; align-items: start; background: var(--bg); border-radius: var(--r-sm); }
.list-item .ta { background: var(--surface); }
.list-remove { margin-top: 3px; }
.list-empty { font-size: 14.5px; color: var(--ink-3); padding: 4px 0; }
.grip {
  width: 28px; height: 40px; display: grid; place-items: center; border-radius: 6px;
  color: var(--ink-3); cursor: grab; touch-action: none; user-select: none; -webkit-user-select: none;
  transition: color 150ms ease, background-color 150ms ease;
}
.grip:active { cursor: grabbing; }
@media (hover: hover) and (pointer: fine) { .grip:hover { color: var(--ink); background: var(--sunk); } }
.add-row {
  display: inline-flex; align-items: center; gap: 8px; justify-self: start;
  padding: 8px 12px 8px 8px; margin-left: -4px; border-radius: 8px;
  font-size: 14.5px; font-weight: 600; color: var(--ink-2);
  touch-action: manipulation; user-select: none; -webkit-user-select: none;
  transition: transform 160ms var(--ease-out), background-color 150ms ease, color 150ms ease;
}
.add-row:active { transform: scale(0.97); }
@media (hover: hover) and (pointer: fine) { .add-row:hover { background: var(--sunk); color: var(--ink); } }

.is-drag-source { opacity: .35; }
.dnd-ghost {
  position: fixed; z-index: 80; margin: 0; pointer-events: none;
  box-shadow: var(--shadow-2); border-radius: var(--r-sm);
  background: var(--surface);
  transition: scale 160ms var(--ease-out), box-shadow 160ms ease;
  will-change: transform;
}
.dnd-ghost.is-lifted { scale: 1.02; box-shadow: var(--shadow-3); }
#dnd-indicator {
  position: fixed; left: 0; top: 0; z-index: 79; height: 3px; border-radius: 3px;
  background: var(--focus); pointer-events: none; opacity: 0;
  transition: opacity 120ms ease;
}
#dnd-indicator.is-visible { opacity: 1; }
html.is-dragging, html.is-dragging * { cursor: grabbing !important; user-select: none !important; -webkit-user-select: none !important; }

/* ---------- people ---------- */
.people-editor { display: grid; gap: 10px; }
.people-list { display: flex; flex-wrap: wrap; gap: 8px; }
.person-chip {
  display: inline-flex; align-items: center; gap: 4px; padding: 3px 3px 3px 4px; border-radius: 999px;
  background: var(--surface); box-shadow: inset 0 0 0 1px var(--line-2); max-width: 100%;
}
.person-name { border: 0; background: transparent; padding: 4px 2px 4px 4px; font-size: 16px; font-weight: 500; min-width: 3ch; max-width: 22ch; border-radius: 6px; }
.person-name:focus { outline: none; background: var(--sunk); }
.chip-x { width: 28px; height: 28px; }
.people-add { display: flex; gap: 8px; }
.people-add .input { flex: 1; min-width: 0; }
.empty-people { display: grid; gap: 12px; padding: 18px; border-radius: var(--r-md); background: var(--sunk); }

.person-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 14px; }
.person-card { display: grid; gap: 12px; align-content: start; padding: 16px; border-radius: var(--r-md); background: var(--surface-2); box-shadow: inset 0 0 0 1px var(--line); }
.person-card-head { display: flex; align-items: center; gap: 10px; }
.person-card-name { font-weight: 600; flex: 1; min-width: 0; overflow-wrap: anywhere; }
.optional { font-size: 12px; color: var(--ink-3); }

.manuals { display: grid; gap: 14px; }
.person-tabs { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: thin; }
.person-tab {
  display: inline-flex; align-items: center; gap: 8px; flex: none;
  padding: 5px 12px 5px 5px; border-radius: 999px; font-size: 14.5px; font-weight: 500;
  box-shadow: inset 0 0 0 1px var(--line-2);
  transition: background-color 150ms ease, color 150ms ease, box-shadow 150ms ease;
}
.person-tab.is-on { background: var(--primary); color: var(--primary-ink); box-shadow: none; }
.person-tab-name { max-width: 16ch; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tab-count { font-family: var(--font-mono); font-size: 11.5px; opacity: .7; font-variant-numeric: tabular-nums; }
.manual-card { display: grid; gap: 16px; padding: 18px; border-radius: var(--r-md); background: var(--surface-2); box-shadow: inset 0 0 0 1px var(--line); }
.manual-title { font-family: var(--font-display); font-size: 20px; font-weight: 650; letter-spacing: -.01em; overflow-wrap: anywhere; }
.manual-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px 18px; }

/* skills marketplace */
.market { display: grid; gap: 16px; }
.market-add { display: flex; flex-wrap: wrap; gap: 10px 12px; align-items: flex-end; padding: 16px; border-radius: var(--r-md); background: var(--sunk); }
.market-add > .field:first-child { flex: 0 1 200px; min-width: 150px; }
.market-add > .market-text { flex: 1 1 260px; }
.market-add .segmented { flex: none; flex-wrap: nowrap; }
.market-add > .btn { margin-left: auto; }
@media (max-width: 640px) {
  .market-add > .field:first-child, .market-add > .market-text { flex-basis: 100%; }
  .market-add > .btn { flex: 1; }
}
.tally { display: flex; flex-wrap: wrap; gap: 8px; }
.tally-item { display: inline-flex; align-items: center; gap: 8px; padding: 4px 12px 4px 4px; border-radius: 999px; background: var(--surface-2); box-shadow: inset 0 0 0 1px var(--line); font-size: 13.5px; max-width: 100%; }
.tally-name { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 14ch; }
.tally-n { color: var(--ink-3); font-variant-numeric: tabular-nums; white-space: nowrap; }
.tally-item.is-done { box-shadow: inset 0 0 0 1.5px var(--step); }
.map-tools { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.map-person { width: auto; }
.new-group { display: flex; gap: 6px; margin-left: auto; min-width: 0; }
.new-group .input { width: 220px; max-width: 100%; }
@media (max-width: 640px) { .new-group { margin-left: 0; width: 100%; } .new-group .input { flex: 1; width: auto; } }
.clusters { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; align-items: start; }
.cluster { display: grid; gap: 8px; padding: 12px; border-radius: var(--r-md); background: var(--surface-2); box-shadow: inset 0 0 0 1px var(--line); }
.cluster-loose { background: transparent; box-shadow: none; border: 1.5px dashed var(--line-2); }
.cluster-head { display: flex; align-items: center; gap: 6px; }
.cluster-name { flex: 1; min-width: 0; font-family: var(--font-display); font-weight: 650; font-size: 16.5px; border: 0; background: transparent; padding: 4px 6px; margin-left: -6px; border-radius: 6px; letter-spacing: -.01em; }
.cluster-name:focus { outline: none; background: var(--sunk); }
.cluster-name.is-static { color: var(--ink-3); font-family: var(--font-body); font-weight: 600; font-size: 14px; }
.cluster-n { font-family: var(--font-mono); font-size: 12px; color: var(--ink-3); font-variant-numeric: tabular-nums; }
.cluster-items { display: grid; gap: 6px; min-height: 44px; }
.cluster-empty { font-size: 13.5px; color: var(--ink-3); padding: 10px; text-align: center; border-radius: 8px; background: var(--sunk); }
.skill {
  display: grid; grid-template-columns: 24px 22px minmax(0, 1fr) auto; grid-template-areas: "grip av text x" ". . meta meta";
  gap: 2px 8px; align-items: center;
  padding: 6px 6px 8px 2px; border-radius: 10px;
  background: var(--surface); box-shadow: inset 0 0 0 1px var(--line);
}
.skill .grip { grid-area: grip; height: 32px; width: 24px; }
.skill .avatar { grid-area: av; }
.skill-text { grid-area: text; font-size: 14.5px; line-height: 1.35; overflow-wrap: anywhere; }
.skill-x { grid-area: x; width: 28px; height: 28px; }
.skill-kind, .skill-move { grid-area: meta; }
.skill-kind { justify-self: start; font-size: 11.5px; font-weight: 600; padding: 1px 8px; border-radius: 999px; background: var(--c5-soft); color: var(--c5-ink); }
.skill-develop { box-shadow: inset 0 0 0 1px var(--line), inset 3px 0 0 var(--c4); }
.skill-develop .skill-kind { background: var(--c4-soft); color: var(--c4-ink); }
.skill-offer { box-shadow: inset 0 0 0 1px var(--line), inset 3px 0 0 var(--c5); }
.skill-move {
  justify-self: end; font-size: 12.5px; color: var(--ink-3); background: transparent; border: 0;
  padding: 2px 4px; border-radius: 6px; max-width: 60%;
}
.skill-move:focus { outline: 2px solid var(--focus); }
.matches { display: grid; gap: 8px; padding: 14px 16px; border-radius: var(--r-md); background: var(--step-soft); }
.matches ul { display: grid; gap: 6px; }
.matches li { font-size: 14.5px; line-height: 1.45; }
.matches li .link { margin-left: 8px; font-size: 14px; }

/* rhythm */
.heartbeat { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)) auto; gap: 6px; align-items: stretch; }
.beat { display: grid; align-content: start; gap: 6px; padding: 10px; border-radius: 10px; background: var(--sunk); min-width: 0; position: relative; }
.beat.has { background: var(--step-soft); }
.beat-label { font-family: var(--font-mono); font-size: 11.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--step-ink); }
.beat-items { display: flex; flex-wrap: wrap; gap: 4px; }
.beat-chip { font-size: 12.5px; padding: 2px 8px; border-radius: 999px; background: var(--surface); overflow-wrap: anywhere; max-width: 100%; }
.beat-none { font-size: 12.5px; color: var(--ink-3); }
.beat-repeat { display: flex; align-items: center; gap: 6px; padding: 0 6px; font-size: 13px; color: var(--ink-3); font-weight: 600; }
@media (max-width: 720px) {
  .heartbeat { grid-template-columns: 1fr 1fr; }
  .beat-repeat { grid-column: 1 / -1; padding: 4px; }
}
.rituals { display: grid; gap: 10px; }
.ritual {
  display: grid; gap: 12px; padding: 12px 14px 14px 8px; border-radius: var(--r-md);
  background: var(--surface-2); box-shadow: inset 0 0 0 1px var(--line);
  transition: opacity 200ms ease;
}
.ritual-remove { background: var(--surface); }
.ritual-remove .ritual-name { text-decoration: line-through; text-decoration-color: var(--c2); color: var(--ink-3); }
.ritual-top { display: flex; align-items: center; gap: 6px; }
.ritual-name { flex: 1; min-width: 0; font-family: var(--font-display); font-size: 19px; font-weight: 650; border: 0; background: transparent; padding: 4px 8px; border-radius: 6px; letter-spacing: -.01em; }
.ritual-name:focus { outline: none; background: var(--surface); box-shadow: inset 0 0 0 1px var(--focus); }
.ritual-name::placeholder { color: var(--ink-3); font-weight: 500; }
.ritual-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; padding-left: 28px; }
.ritual-purpose { grid-column: 1 / -1; }
.ritual-grid .field-label, .ritual-purpose .field-label { font-size: 13px; color: var(--ink-3); font-weight: 600; }
.ritual-controls { display: flex; flex-wrap: wrap; gap: 8px 16px; padding-left: 28px; }
@media (max-width: 880px) { .ritual-grid { grid-template-columns: 1fr 1fr; } .ritual-grid > .field:nth-child(2) { grid-column: 1 / -1; } }
@media (max-width: 520px) { .ritual-grid, .ritual-controls { padding-left: 4px; } .ritual-grid { grid-template-columns: 1fr; } }
.empty-block { display: grid; gap: 12px; justify-items: start; padding: 18px; border-radius: var(--r-md); background: var(--sunk); margin-bottom: 6px; }
.empty-block p { color: var(--ink-2); }

/* decide */
.mechanisms { border-radius: var(--r-md); background: var(--sunk); padding: 4px 16px; }
.mechanisms summary { cursor: pointer; padding: 10px 0; font-weight: 600; font-size: 15px; list-style: none; display: flex; align-items: center; gap: 6px; }
.mechanisms summary::-webkit-details-marker { display: none; }
.sum-chev { transition: transform 200ms var(--ease-out); }
.mechanisms[open] .sum-chev { transform: rotate(90deg); }
.mechanisms dl { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 12px 20px; margin: 0; padding: 4px 0 16px; }
.mechanisms dt { font-weight: 600; font-size: 14.5px; }
.mechanisms dd { margin: 2px 0 0; font-size: 14px; color: var(--ink-2); line-height: 1.45; }

.dec-table { display: grid; gap: 8px; }
.dec-body { display: grid; gap: 8px; }
.dec-row {
  display: grid; grid-template-columns: 28px repeat(3, minmax(0, 1fr)) 34px;
  grid-template-areas: "g d d m x" "g o c i x";
  gap: 10px 10px; align-items: start;
  padding: 12px 6px 14px 0; border-radius: var(--r-md);
  background: var(--surface-2); box-shadow: inset 0 0 0 1px var(--line);
}
.dec-row > .grip { grid-area: g; }
.dec-row > .dec-decision { grid-area: d; }
.dec-row > .dec-mech { grid-area: m; }
.dec-row > .dec-owner { grid-area: o; }
.dec-row > .dec-consult { grid-area: c; }
.dec-row > .dec-inform { grid-area: i; }
.dec-row > .dec-x { grid-area: x; margin-top: 18px; }
.dec-cell { display: grid; gap: 4px; min-width: 0; align-content: start; }
.dec-label { font-size: 12.5px; color: var(--ink-3); font-weight: 600; }
.dec-decision .ta { font-weight: 600; }
@media (max-width: 600px) {
  .dec-row { grid-template-columns: 28px minmax(0, 1fr) 34px; grid-template-areas: "g d x" "g m x" "g o x" "g c x" "g i x"; }
}
.rules-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 8px; }
.rules-head .link-draft { margin-top: 0; }
.rules { display: grid; gap: 8px; }
.rule {
  display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px;
  padding: 8px 6px 8px 0; border-radius: var(--r-md); background: var(--step-soft);
}
.rule-word { font-family: var(--font-display); font-weight: 600; color: var(--step-ink); font-size: 16px; }
.rule-dot { margin-left: -6px; }
.rule-input { flex: 2 1 220px; width: auto; min-width: 0; }
.rule-mech { flex: 1 1 150px; width: auto; min-width: 0; }
.rule .icon-btn { margin-left: auto; }

/* agree */
.board { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
@media (max-width: 720px) { .board { grid-template-columns: 1fr; } }
.zone { display: grid; gap: 10px; align-content: start; padding: 16px; border-radius: 28px; }
.zone-in { background: var(--c5-soft); }
.zone-out { background: var(--c2-soft); }
.zone-head { display: flex; align-items: baseline; gap: 10px; padding: 0 4px; }
.zone-title { font-family: var(--font-display); font-weight: 800; font-size: 30px; letter-spacing: -.02em; line-height: 1; }
.zone-in .zone-title { color: var(--c5-ink); }
.zone-out .zone-title { color: var(--c2-ink); }
.zone-sub { font-size: 14px; color: var(--ink-2); flex: 1; }
.zone-n { font-family: var(--font-mono); font-size: 12.5px; color: var(--ink-3); font-variant-numeric: tabular-nums; }
.zone-items { display: grid; gap: 8px; min-height: 60px; }
.zone .cluster-empty { background: color-mix(in srgb, var(--surface) 55%, transparent); }
.note {
  display: grid; grid-template-columns: 26px minmax(0, 1fr); gap: 2px 4px; align-items: start;
  padding: 6px 6px 4px 2px; border-radius: 12px; background: var(--surface);
  box-shadow: var(--shadow-1);
  transition: box-shadow 160ms ease;
}
.note .grip { width: 26px; }
.note .ta { border-color: transparent; background: transparent; padding: 8px 6px; }
.note .ta:focus { border-color: var(--focus); background: var(--surface); }
.note-actions { grid-column: 2; display: flex; gap: 2px; justify-content: flex-end; margin-top: -4px; }
.note-actions .icon-btn { width: 30px; height: 30px; }
.note.is-promoted { box-shadow: var(--shadow-1), inset 0 0 0 2px var(--c1); }
.promote.is-on { color: var(--c1); }
.promote.is-on svg path { fill: currentColor; }
.zone-add { display: flex; gap: 8px; align-items: flex-start; }
.zone-add .ta { background: color-mix(in srgb, var(--surface) 70%, transparent); border-style: dashed; }
.zone-add .btn { margin-top: 3px; }

.agreements { display: grid; gap: 10px; padding-top: 12px; }
.agreements-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 8px; }
.sub-title { font-family: var(--font-display); font-size: 20px; font-weight: 650; letter-spacing: -.01em; }
.agree-count { font-size: 13.5px; color: var(--ink-3); font-variant-numeric: tabular-nums; }
.agree-count.is-good { color: var(--c5-ink); font-weight: 600; }
.agreement-list { display: grid; gap: 8px; }
.agreement {
  display: grid; grid-template-columns: 28px 26px minmax(0, 1fr) 34px; gap: 6px; align-items: start;
  padding: 10px 6px 12px 0; border-radius: var(--r-md); background: var(--surface-2); box-shadow: inset 0 0 0 1px var(--line);
}
.agreement-n { font-family: var(--font-display); font-weight: 800; font-size: 22px; line-height: 1; padding-top: 8px; color: var(--step-ink); font-variant-numeric: tabular-nums; }
.agreement-body { display: grid; gap: 8px; min-width: 0; }
.zone-tag { justify-self: start; font-family: var(--font-mono); font-size: 11px; font-weight: 500; padding: 1px 7px; border-radius: 999px; letter-spacing: .06em; }
.agreement-in .zone-tag { background: var(--c5-soft); color: var(--c5-ink); }
.agreement-out .zone-tag { background: var(--c2-soft); color: var(--c2-ink); }
.agreement-text { font-weight: 600; }
.repair { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 4px 10px; align-items: baseline; }
.repair label { font-size: 13.5px; color: var(--ink-3); white-space: nowrap; }
.repair .ta { font-size: 15px; padding: 6px 10px; }
@media (max-width: 560px) { .repair { grid-template-columns: 1fr; } }

/* evolve */
.kct { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; align-items: start; }
.kct-try { grid-column: 1 / -1; }
@media (max-width: 600px) { .kct { grid-template-columns: 1fr; } }
.kct-col { display: grid; gap: 8px; padding: 14px; border-radius: var(--r-md); }
.kct-keep { background: var(--c5-soft); }
.kct-change { background: var(--c1-soft); }
.kct-try { background: var(--c3-soft); }
.kct-title { font-family: var(--font-display); font-weight: 800; font-size: 24px; letter-spacing: -.02em; line-height: 1; }
.kct-keep .kct-title { color: var(--c5-ink); }
.kct-change .kct-title { color: var(--c1-ink); }
.kct-try .kct-title { color: var(--c3-ink); }
.kct-q { font-size: 14px; color: var(--ink-2); margin-bottom: 2px; }
.kct .list-item { background: transparent; }
.kct .add-row { color: var(--ink); }
.try-item { grid-template-columns: 28px minmax(0, 1fr) 34px; }
.try-body { display: grid; gap: 6px; padding: 8px; border-radius: var(--r-sm); background: var(--surface); }
.try-body > .ta { border-color: transparent; padding: 4px 6px; font-weight: 600; }
.try-body > .ta:focus { border-color: var(--focus); }
.try-meta { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.8fr) minmax(0, 1fr); gap: 8px; }
@media (max-width: 640px) { .try-meta { grid-template-columns: 1fr 1fr; } .mini-wide { grid-column: 1 / -1; order: 3; } }
.mini .input { width: 100%; min-width: 0; }
.mini { display: grid; gap: 2px; font-size: 12px; color: var(--ink-3); font-weight: 600; min-width: 0; }
.mini .input { font-weight: 400; }

/* setup */
.setup-form { display: grid; gap: 26px; padding: 24px; border-radius: var(--r-lg); background: var(--surface); box-shadow: var(--shadow-1), inset 0 0 0 1px var(--line); }
@media (min-width: 640px) { .setup-form { padding: 32px; } }
.setup-form .field-lead .input { font-family: var(--font-display); font-size: 22px; font-weight: 600; padding: 12px 14px; letter-spacing: -.01em; }
.setup-actions { display: flex; gap: 10px; justify-content: flex-end; flex-wrap: wrap; }

/* ---------- example banner ---------- */
.example-banner {
  display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; justify-content: space-between;
  margin: 14px auto 0; max-width: 860px; padding: 10px 14px; border-radius: var(--r-md);
  background: var(--c1-soft); color: var(--c1-ink); font-size: 14.5px;
}
.view-canvas .example-banner { max-width: 1320px; }
.example-banner .link { color: var(--c1-ink); }

/* ---------- canvas view ---------- */
.canvas-view { display: grid; gap: 20px; padding-top: 24px; }
@media (min-width: 960px) { .canvas-view { padding-top: 36px; } }
.canvas-toolbar { display: flex; flex-wrap: wrap; gap: 14px; align-items: flex-end; justify-content: space-between; }
.canvas-toolbar-title { display: grid; gap: 4px; max-width: 44ch; }
.toolbar-actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.canvas-layout { display: grid; gap: 20px; align-items: start; }
@media (min-width: 1200px) { .canvas-layout.with-review { grid-template-columns: minmax(0, 1fr) 300px; } }
.canvas-paper { min-width: 0; }

.review { display: grid; gap: 14px; padding: 18px; border-radius: var(--r-lg); background: var(--surface); box-shadow: var(--shadow-1), inset 0 0 0 1px var(--line); }
@media (min-width: 1200px) { .review { position: sticky; top: 24px; max-height: calc(100dvh - 48px); overflow-y: auto; } }
.review header { display: grid; gap: 2px; }
.review-title { font-family: var(--font-display); font-size: 20px; font-weight: 650; }
.review-count { font-size: 13.5px; color: var(--ink-3); }
.review-list { display: grid; gap: 12px; }
.review-row { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 8px; align-items: center; }
.review-name { font-size: 14.5px; font-weight: 600; line-height: 1.3; }
.review-missing { display: grid; gap: 3px; padding-left: 30px; margin-top: 4px; }
.review-missing li { font-size: 13.5px; color: var(--ink-2); }
.review-missing .link { color: var(--ink-2); }
.review .step-badge { background: var(--step-soft); }

/* manifesto */
.manifesto {
  --mf-pad: clamp(20px, 4vw, 48px);
  display: grid; gap: clamp(20px, 3vw, 32px);
  padding: var(--mf-pad);
  border-radius: var(--r-lg);
  background: var(--surface);
  box-shadow: var(--shadow-2), inset 0 0 0 1px var(--line);
  container-type: inline-size;
  container-name: mf;
}
.mf-head { display: grid; gap: 14px; padding-bottom: clamp(16px, 2.5vw, 26px); border-bottom: 1px solid var(--line); }
.mf-kicker { display: flex; flex-wrap: wrap; gap: 6px 16px; align-items: baseline; justify-content: space-between; }
.mf-version { font-size: 13px; color: var(--ink-3); font-variant-numeric: tabular-nums; }
.mf-name {
  font-family: var(--font-display); font-weight: 750; letter-spacing: -.035em; line-height: .98;
  font-size: clamp(34px, 7cqi, 80px); font-variation-settings: "opsz" 96;
  overflow-wrap: anywhere;
}
.mf-name-edit, .mf-desc-edit { border: 1px dashed transparent; background: transparent; padding: 2px 6px; margin-left: -7px; border-radius: 8px; }
.mf-name-edit:hover, .mf-desc-edit:hover { border-color: var(--line-2); }
.mf-name-edit:focus, .mf-desc-edit:focus { border-color: var(--focus); border-style: solid; box-shadow: none; }
.mf-desc { font-size: clamp(17px, 2vw, 20px); color: var(--ink-2); max-width: 46em; line-height: 1.45; }
.mf-meta { display: flex; flex-wrap: wrap; gap: 14px 40px; margin: 6px 0 0; }
.mf-meta > div { display: grid; gap: 4px; min-width: 0; }
.mf-meta dt { font-family: var(--font-mono); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); }
.mf-meta dd { margin: 0; font-weight: 600; font-size: 15px; }
.mf-people { flex: 1 1 320px; }
.mf-avatars { display: flex; flex-wrap: wrap; gap: 6px 14px; }
.mf-avatars li { display: inline-flex; align-items: center; gap: 7px; font-weight: 500; }

.mf-grid { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: clamp(12px, 1.6vw, 18px); }
.cv-block {
  display: grid; gap: 14px; align-content: start; min-width: 0;
  padding: clamp(16px, 2vw, 24px);
  border-radius: var(--r-md);
  background: var(--step-soft);
}
.cv-purpose { grid-column: span 7; }
.cv-future { grid-column: span 5; }
.cv-people { grid-column: span 12; }
.cv-rhythm { grid-column: span 6; }
.cv-decisions { grid-column: span 6; }
.cv-agreements { grid-column: span 12; }
.cv-evolve { grid-column: span 12; }
@container mf (max-width: 760px) { .mf-grid > .cv-block { grid-column: 1 / -1; } }
.cv-block-head { display: flex; align-items: center; gap: 10px; }
.cv-n { display: grid; place-items: center; width: 26px; height: 26px; border-radius: 50%; background: var(--step); color: var(--surface); font-family: var(--font-mono); font-size: 12px; font-weight: 500; flex: none; }
.cv-title { font-family: var(--font-display); font-weight: 700; font-size: clamp(18px, 2.2cqi, 23px); letter-spacing: -.02em; color: var(--step-ink); flex: 1; }
.cv-edit-link { display: inline-flex; align-items: center; gap: 5px; font-size: 13px; font-weight: 600; color: var(--step-ink); padding: 4px 8px; border-radius: 999px; background: color-mix(in srgb, var(--surface) 55%, transparent); transition: background-color 150ms ease; }
@media (hover: hover) and (pointer: fine) { .cv-edit-link:hover { background: var(--surface); } }
.cv-block-body { display: grid; gap: 14px; }
.cv-line { display: grid; gap: 3px; min-width: 0; align-content: start; }
.cv-label { font-size: 13px; font-weight: 600; color: var(--step-ink); }
.cv-text { white-space: pre-line; font-size: 16px; line-height: 1.5; overflow-wrap: anywhere; }
.cv-big .cv-text, .cv-big .cv-edit { font-family: var(--font-display); font-size: clamp(19px, 2.6cqi, 27px); line-height: 1.24; letter-spacing: -.015em; font-weight: 600; }
.cv-edit { background: color-mix(in srgb, var(--surface) 55%, transparent); border: 1px solid transparent; padding: 6px 8px; margin-left: -9px; width: calc(100% + 9px); }
.cv-edit:hover { border-color: color-mix(in srgb, var(--step) 40%, transparent); }
.cv-edit:focus { background: var(--surface); }
.cv-missing { font-size: 14px; color: var(--ink-3); font-style: italic; }
.cv-list { display: grid; gap: 6px; }
.cv-list > li { position: relative; padding-left: 16px; line-height: 1.45; overflow-wrap: anywhere; white-space: pre-line; }
.cv-list > li::before { content: ""; position: absolute; left: 0; top: .62em; width: 6px; height: 6px; border-radius: 2px; background: var(--step); rotate: 45deg; }
.cv-cols { display: grid; gap: 16px 22px; }
.cv-cols-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.cv-cols-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
@container mf (max-width: 640px) { .cv-cols-3, .cv-cols-2 { grid-template-columns: 1fr; } }
.cv-roster { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px; padding-top: 14px; border-top: 1px dashed var(--step); }
.cv-roster li { display: flex; gap: 10px; align-items: flex-start; font-size: 14.5px; line-height: 1.4; min-width: 0; }
.cv-roster li > div { display: grid; gap: 1px; min-width: 0; overflow-wrap: anywhere; }
.cv-story-title { font-size: 13px; color: var(--step-ink); font-style: italic; }
.cv-rituals { display: grid; gap: 6px; }
.cv-rituals li { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 2px 10px; padding: 6px 10px; border-radius: 8px; background: var(--surface-2); }
.cv-ritual-name { font-weight: 600; }
.cv-ritual-meta { font-size: 13.5px; color: var(--ink-2); }
.cv-inout .cv-label { font-family: var(--font-display); font-weight: 800; font-size: 20px; letter-spacing: -.01em; }
.cv-in .cv-label { color: var(--c5-ink); }
.cv-out .cv-label { color: var(--c2-ink); }
.cv-out .cv-list > li::before { background: var(--c2); }
.cv-in .cv-list > li::before { background: var(--c5); }
.cv-inout .cv-list > li { font-weight: 600; }
.cv-repair { display: block; font-weight: 400; font-size: 14px; color: var(--ink-2); margin-top: 2px; }
.cv-try-meta { display: block; font-size: 13.5px; color: var(--ink-2); margin-top: 2px; }
.cv-evolve-foot { padding-top: 14px; border-top: 1px dashed var(--step); }
.cv-date { font-weight: 600; }
.mf-foot { display: flex; align-items: center; gap: 8px; font-size: 14px; color: var(--ink-3); padding-top: 4px; }

/* presentation */
.present {
  position: fixed; inset: 0; z-index: 70; overflow-y: auto; overscroll-behavior: contain;
  background: var(--bg);
  padding: max(24px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(24px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
  animation: fade-in 220ms ease both;
}
.present:focus { outline: none; }
@keyframes fade-in { from { opacity: 0; } }
.present .manifesto { max-width: 1500px; margin: 0 auto; box-shadow: none; background: transparent; padding: clamp(8px, 3vw, 48px); }
.manifesto-present .mf-name { font-size: clamp(44px, 7vw, 112px); }
.manifesto-present .cv-text { font-size: clamp(16px, 1.35vw, 21px); }
.manifesto-present .cv-list > li { font-size: clamp(16px, 1.35vw, 21px); }
.manifesto-present .cv-big .cv-text { font-size: clamp(22px, 2.6cqi, 40px); }
.manifesto-present .cv-title { font-size: clamp(20px, 1.9vw, 30px); }
.present-exit {
  position: fixed; z-index: 2;
  top: max(14px, calc(env(safe-area-inset-top, 0px) + 8px)); right: max(14px, calc(env(safe-area-inset-right, 0px) + 8px));
  display: inline-flex; align-items: center; gap: 8px; padding: 8px 12px; border-radius: 999px;
  background: var(--surface); box-shadow: var(--shadow-2); font-size: 14px; font-weight: 600;
  transition: opacity 300ms ease, transform 160ms var(--ease-out);
}
.present-exit:active { transform: scale(0.97); }
.present-exit.is-idle { opacity: 0; }
.present-exit.is-idle:focus-visible { opacity: 1; }
html.is-presenting body { overflow: hidden; }

/* ---------- modal ---------- */
.modal-root { position: fixed; inset: 0; z-index: 75; display: grid; place-items: center; padding: max(16px, env(safe-area-inset-top, 0px)) var(--gutter-r) max(16px, env(safe-area-inset-bottom, 0px)) var(--gutter-l); }
.modal-backdrop { position: absolute; inset: 0; background: var(--backdrop); opacity: 0; transition: opacity 150ms ease; }
.modal {
  position: relative; width: min(520px, 100%); max-height: 100%; overflow-y: auto;
  background: var(--surface); border-radius: var(--r-lg); box-shadow: var(--shadow-3);
  padding: 20px 22px 22px;
  opacity: 0; transform: scale(.97);
  transition: opacity 150ms ease, transform 150ms var(--ease-out);
}
.modal-wide { width: min(940px, 100%); }
.modal-root.is-shown .modal-backdrop { opacity: 1; transition-duration: 200ms; }
.modal-root.is-shown .modal { opacity: 1; transform: none; transition-duration: 220ms; }
.modal-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 10px; }
.modal-title { font-family: var(--font-display); font-size: 23px; font-weight: 700; letter-spacing: -.02em; }
.modal-body { display: grid; gap: 14px; }
.modal-body > p { color: var(--ink-2); }
.plain-steps { list-style: decimal; padding-left: 22px; display: grid; gap: 6px; color: var(--ink-2); }
.data-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 28px; }
@media (max-width: 720px) { .data-grid { grid-template-columns: 1fr; } }
.data-col { display: grid; gap: 10px; align-content: start; min-width: 0; justify-items: start; }
.data-actions { display: flex; flex-wrap: wrap; gap: 8px; }
.json-view {
  width: 100%; height: 200px; resize: vertical;
  font-family: var(--font-mono); font-size: 12.5px; line-height: 1.5;
  background: var(--sunk); color: var(--ink-2); border: 1px solid var(--line); border-radius: var(--r-sm); padding: 10px;
}
.json-paste { height: 120px; background: var(--surface); }
.import-or { margin-top: 8px; font-size: 14px; }
.import-confirm { display: grid; gap: 10px; padding: 14px; border-radius: var(--r-md); background: var(--sunk); width: 100%; }

/* ---------- toasts ---------- */
.toaster {
  position: fixed; z-index: 90; left: 50%; bottom: max(20px, calc(env(safe-area-inset-bottom, 0px) + 12px));
  translate: -50% 0; display: grid; gap: 8px; justify-items: center; pointer-events: none; width: max-content; max-width: calc(100% - 32px);
}
.view-step ~ .toaster { bottom: calc(84px + env(safe-area-inset-bottom, 0px)); }
.toast {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 10px 16px; border-radius: 999px;
  background: var(--primary); color: var(--primary-ink); font-size: 14.5px; font-weight: 500;
  box-shadow: var(--shadow-2);
  opacity: 0; transform: translateY(100%);
  transition: opacity 300ms ease, transform 300ms ease;
}
.toast.is-shown { opacity: 1; transform: none; }
.toast.is-leaving { opacity: 0; transform: translateY(30%); transition-duration: 200ms; }
@media (max-width: 959px) {
  body:has(.mobile-actions) .toaster { bottom: calc(84px + env(safe-area-inset-bottom, 0px)); }
}

/* ---------- print ---------- */
.print-only { display: none; }
@media print {
  :root { color-scheme: light; }
  :root, :root:not([data-theme="light"]), :root[data-theme="dark"] {
    --bg: #FFFFFF; --surface-2: #FAFAFC; --sunk: #F0F1F5; --line-2: #C9CEDA; --surface: #FFFFFF; --ink: #15182C; --ink-2: #3E4360; --ink-3: #6A6F88; --line: #DADDE6;
    --c1: #D68A1F; --c1-soft: #FBF0DE; --c1-ink: #7A4D08;
    --c2: #D9573F; --c2-soft: #FCE8E3; --c2-ink: #93331F;
    --c3: #317CC4; --c3-soft: #E4F0FB; --c3-ink: #1A5287;
    --c4: #7353C7; --c4-soft: #EFE9FB; --c4-ink: #4B2E8C;
    --c5: #22906D; --c5-soft: #E0F3EC; --c5-ink: #13614A;
    --c6: #638B1F; --c6-soft: #ECF3DE; --c6-ink: #41600F;
  }
  @page { size: A4; margin: 12mm; }
  html, body { background: #FFFFFF !important; }
  body::before { display: none; }
  .app, .toaster, .drawer-root, .modal-root, .present { display: none !important; }
  .print-only { display: block; }
  * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  .manifesto { box-shadow: none; border-radius: 0; padding: 0; gap: 14px; font-size: 11pt; }
  .mf-name { font-size: 28pt; }
  .mf-grid { gap: 8px; }
  .cv-block { padding: 12px 14px; -webkit-box-decoration-break: clone; box-decoration-break: clone; }
  .cv-block-head, .cv-line, .cv-list > li, .cv-roster li, .cv-rituals li { break-inside: avoid; page-break-inside: avoid; }
  .cv-block-head { break-after: avoid; }
  .cv-big .cv-text { font-size: 13.5pt; }
  .cv-text, .cv-list > li { font-size: 10.5pt; }
  .cv-title { font-size: 13pt; }
  .mf-grid > .cv-purpose { grid-column: span 7; }
  .mf-grid > .cv-future { grid-column: span 5; }
  .mf-grid > .cv-rhythm, .mf-grid > .cv-decisions { grid-column: span 6; }
  .mf-grid > .cv-people, .mf-grid > .cv-agreements, .mf-grid > .cv-evolve { grid-column: span 12; }
  .cv-cols-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .cv-cols-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .mf-foot { break-inside: avoid; }
}

/* ---------- reduced motion ---------- */
@media (prefers-reduced-motion: reduce) {
  .view-enter { animation: fade-in 160ms ease both; }
  .journey-step { animation: fade-in 200ms ease both; rotate: none; }
  .collapse { transition: opacity 150ms ease; }
  .toggle-chev, .sum-chev { transition: none; }
  .drawer { transition: none; }
  .drawer-backdrop, .modal-backdrop { transition: opacity 150ms ease; }
  .modal { transform: none; }
  .toast { transform: none; }
  .dnd-ghost { transition: none; }
  .dnd-ghost.is-lifted { scale: 1; }
  .btn:active:not(:disabled), .icon-btn:active, .add-row:active, .chip-btn:active, .starter:active { transform: none; }
  .save-state.is-saving .save-dot { animation: none; }
}

/* single-column grids never grow past their container */
.section, .section-body, .exercise, .capture, .canvas-output, .canvas-output-fields, .setup, .market, .manuals, .list-editor, .field, .instructions, .people-editor { grid-template-columns: minmax(0, 1fr); }
.rituals, .ritual, .list-items, .rules, .agreement-list, .zone-items, .cluster-items, .dec-body, .dec-table, .board > .zone, .kct-col, .agreements, .checklist, .clusters > .cluster { grid-template-columns: minmax(0, 1fr); }
.new-group .input { min-width: 0; }
@media (max-width: 520px) {
  .exercise, .canvas-output { padding: 18px 16px; }
  .try-meta { grid-template-columns: 1fr; }
  .mini-wide { order: 0; }
  .agreement { grid-template-columns: 28px minmax(0, 1fr) 34px; }
  .agreement-n { display: none; }
}

/* off-screen stage the PDF is drawn from: always the light palette, fixed A4-ish width */
.pdf-stage {
  position: fixed; left: -20000px; top: 0; width: 820px; pointer-events: none;
  --bg: #FFFFFF; --surface: #FFFFFF; --surface-2: #F8F9FB; --sunk: #EBEDF2;
  --ink: #181B32; --ink-2: #454A65; --ink-3: #6E738C; --line: #E0E3EB; --line-2: #C9CEDA;
  --c1: #DE942A; --c1-soft: #FBEFD9; --c1-ink: #84540A;
  --c2: #E0634D; --c2-soft: #FCE6E1; --c2-ink: #9E3725;
  --c3: #3A86CF; --c3-soft: #E1EEFA; --c3-ink: #1D5891;
  --c4: #7D5ACF; --c4-soft: #EEE7FB; --c4-ink: #513296;
  --c5: #279A76; --c5-soft: #DDF2EA; --c5-ink: #16694F;
  --c6: #6C9724; --c6-soft: #EAF2DB; --c6-ink: #476811;

}
.pdf-stage .manifesto { box-shadow: none; border-radius: 0; padding: 8px 4px; background: #FFFFFF; }

.pdf-stage .cv-big .cv-text { font-size: 22px; }
.pdf-stage .cv-list > li::before { rotate: none; border-radius: 50%; }
.pdf-stage .avatar { box-shadow: none; }

/* ================= illustrations ================= */
.illo, .hero-ring, .canvas-mini, .mech-glyph, .progress-ring { display: block; width: 100%; height: auto; overflow: visible; }
.i-a { fill: var(--step); }
.i-a2 { fill: var(--step-ink); }

.i-s3 { fill: color-mix(in srgb, var(--step) 38%, var(--surface)); }
.i-p { fill: var(--surface); }
.i-ink { fill: var(--ink); }
.i-mute { fill: var(--line-2); }
.i-k { stroke: var(--ink); stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
.i-ln { stroke: var(--step); stroke-linecap: round; stroke-linejoin: round; }
.i-ink2 { stroke: var(--step-ink); stroke-linecap: round; stroke-linejoin: round; }

.i-w3 { stroke-width: 4; }
.i-dash { stroke-dasharray: 1 7; }

.i-road { stroke: var(--surface); stroke-width: 20; stroke-linecap: round; }
.i-text { font-family: var(--font-display); font-weight: 800; font-size: 22px; fill: var(--step-ink); letter-spacing: -.01em; }
.i-text-sm { font-size: 15px; }
.ring-line { stroke: var(--line-2); stroke-width: 2.5; stroke-dasharray: 1 9; stroke-linecap: round; }
.ring-arrow { fill: var(--ink-3); }
.ring-n { font-family: var(--font-mono); font-size: 12px; fill: var(--step-ink); }
.ring-label { font-family: var(--font-display); font-weight: 700; font-size: 20px; fill: var(--step-ink); letter-spacing: -.01em; }
.ring-note { transition: transform 300ms var(--ease-out); }

/* ================= landing ================= */
.landing-about-link { font-size: 15px; }

.convos { display: grid; gap: 20px; }
.convos-head { display: grid; gap: 8px; }
.convos-title { font-family: var(--font-display); font-size: clamp(28px, 3.6vw, 40px); font-weight: 700; letter-spacing: -.025em; }

@media (max-width: 900px) { .convo-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 560px) { .convo-grid { grid-template-columns: 1fr; } }
.convo-card, .hub-card {
  display: grid; width: 100%; height: 100%; text-align: left; align-content: start;
  border-radius: var(--r-lg); overflow: hidden;

}

@media (hover: hover) and (pointer: fine) {
  .convo-card:hover, .hub-card:hover { box-shadow: var(--shadow-2), inset 0 0 0 1.5px var(--step); }

}

.convo-body, .hub-body { display: grid; gap: 6px; padding: 16px 18px 18px; align-content: start; }
.hub-eyebrow { display: inline-flex; align-items: center; gap: 8px; font-family: var(--font-mono); font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--step-ink); }

/* ================= hub ================= */
.hub { display: grid; gap: 28px; padding-top: 28px; }

@media (max-width: 560px) { .hub-head { grid-template-columns: 1fr; } .progress-ring { max-width: 130px; order: -1; } }
.pr-arc { fill: none; stroke-width: 12; stroke-linecap: round; stroke: var(--line); }

.about-text { display: grid; gap: 10px; min-width: 0; }
